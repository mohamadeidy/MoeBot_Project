name: MoeBot Group 8 Source Restore Failure Diagnostic

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_SOURCE_RESTORE_FAILURE_DIAGNOSTIC.txt"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract exact source-restore failure context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/context"
          for spec in "2023:89767644659" "2024:89767644644"; do
            year="${spec%%:*}"; job="${spec##*:}"
            gh api "/repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" > "$RUNNER_TEMP/$year.log"
            YEAR="$year" python - <<'PY'
          from pathlib import Path
          import os
          year=os.environ['YEAR']
          lines=(Path(os.environ['RUNNER_TEMP'])/f'{year}.log').read_text(errors='replace').splitlines()
          patterns=(
              'Restore and verify canonical source database only',
              'group8_restore_frozen_source.py',
              'group8_real_schema_intake.py',
              'Traceback', 'RuntimeError', 'FileNotFoundError', 'CalledProcessError',
              'checksum', 'identity mismatch', 'sqlite', 'curl:', 'zstd:',
              '##[error]', 'error:', 'failed',
          )
          anchors=[i for i,line in enumerate(lines) if any(p.lower() in line.lower() for p in patterns)]
          selected=[]
          for i in anchors:
              selected.extend(lines[max(0,i-10):min(len(lines),i+30)])
          selected.extend(lines[-160:])
          seen=set();out=[]
          for line in selected:
              if line not in seen:
                  seen.add(line);out.append(line)
          p=Path(os.environ['RUNNER_TEMP'])/f'context/GROUP8_SOURCE_RESTORE_FAILURE_{year}.txt'
          p.write_text('\n'.join(out)+'\n')
          print(f'===== {year} =====')
          print(p.read_text()[-30000:])
          PY
          done
      - uses: actions/upload-artifact@v4
        with:
          name: group8-source-restore-failure-context
          path: ${{ runner.temp }}/context
          retention-days: 30
