name: MoeBot Group 8 Cross-Year and Closure Candidate

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_CROSS_YEAR_CLOSURE_CANDIDATE.txt"
  workflow_dispatch:

permissions:
  contents: write

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  PYTHONUNBUFFERED: "1"

jobs:
  cross-year-and-closure-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight completed frozen 2024 OOS and revoked execution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("MoeBot_Trading_System/Group_8")
          s=json.loads((root/"STATUS.json").read_text());b=json.loads((root/"ENGINE_BUILD_MANIFEST.json").read_text());a23=json.loads((root/"ANNUAL_2023_VALIDATION_MANIFEST.json").read_text());o=json.loads((root/"OOS_FREEZE_MANIFEST.json").read_text());a24=json.loads((root/"ANNUAL_2024_OOS_VALIDATION_MANIFEST.json").read_text())
          if s.get("officially_closed") is not False or s.get("status")!="ANNUAL_2024_OOS_PASS_CROSS_YEAR_REQUIRED": raise SystemExit("wrong cross-year phase")
          if any(s.get(k) for k in ("annual_execution_authorized","annual_execution_2023_authorized","annual_execution_2024_authorized")): raise SystemExit("annual execution must remain revoked")
          if b.get("status")!="TECHNICAL_CANDIDATE_PASS" or int(b.get("format_version",0))<2: raise SystemExit("technical candidate v2 invalid")
          if a23.get("status")!="ANNUAL_2023_PASS": raise SystemExit("2023 annual not PASS")
          if o.get("status")!="FROZEN_FOR_2024_OOS" or int(o.get("format_version",0))<2: raise SystemExit("OOS freeze v2 invalid")
          if a24.get("status")!="ANNUAL_2024_OOS_PASS" or int(a24.get("format_version",0))<2: raise SystemExit("2024 OOS v2 not PASS")
          if a23.get("engine_build_manifest_hash")!=b.get("manifest_hash") or a24.get("engine_build_manifest_hash")!=b.get("manifest_hash"): raise SystemExit("annual build identity drift")
          if a24.get("oos_freeze_manifest_hash")!=o.get("manifest_hash"): raise SystemExit("2024 OOS freeze identity drift")
          if o.get("annual_validator_sha256")!=b.get("identities",{}).get("annual_validator",{}).get("sha256") or a24.get("annual_validator_sha256")!=o.get("annual_validator_sha256"): raise SystemExit("annual-validator identity drift")
          if o.get("closed_blocking_gap",{}).get("gap_id")!="G8-ICT-LOCKED-CONTEXT-005" or a24.get("closed_blocking_gap",{}).get("gap_id")!="G8-ICT-LOCKED-CONTEXT-005": raise SystemExit("locked-context provenance drift")
          if int(a24.get("locked_context_violations",-1))!=0: raise SystemExit("2024 locked-context violations")
          print({"status":"PASS","engine_sha256":b["identities"]["engine"]["sha256"],"annual_validator_sha256":o["annual_validator_sha256"],"2023_manifest_hash":a23["manifest_hash"],"2024_manifest_hash":a24["manifest_hash"]})
          PY
      - name: Compile cross-year and closure candidate tooling
        run: |
          python -m py_compile \
            "$GROUP8_ROOT/code/group8_cross_year_validation.py" \
            "$GROUP8_ROOT/code/group8_prepare_closure_candidate.py" \
            "$GROUP8_ROOT/code/group8_finalize_official_release_closure.py"
      - name: Run independent cross-year validation
        run: |
          python "$GROUP8_ROOT/code/group8_cross_year_validation.py" \
            --group8-root "$GROUP8_ROOT" \
            --output "$GROUP8_ROOT/reports/50_CROSS_YEAR_VALIDATION.json"
      - name: Independently verify cross-year PASS without calibration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("MoeBot_Trading_System/Group_8");r=json.loads((root/"reports/50_CROSS_YEAR_VALIDATION.json").read_text());b=json.loads((root/"ENGINE_BUILD_MANIFEST.json").read_text())
          if r.get("status")!="PASS" or int(r.get("format_version",0))<2 or r.get("failures"): raise SystemExit("cross-year report not PASS")
          if r.get("2024_is_frozen_oos") is not True or r.get("identity_stable_across_oos_boundary") is not True: raise SystemExit("OOS identity not stable")
          if r.get("locked_context_violations_both_years_zero") is not True: raise SystemExit("locked-context violations across years")
          if r.get("no_trading_outputs_both_years") is not True or r.get("read_only_upstream_both_years") is not True: raise SystemExit("scope/read-only violation")
          if r.get("annual_validator_sha256")!=b.get("identities",{}).get("annual_validator",{}).get("sha256"): raise SystemExit("cross-year validator identity drift")
          if r.get("closed_blocking_gap_id")!="G8-ICT-LOCKED-CONTEXT-005": raise SystemExit("cross-year gap provenance drift")
          if "No pass/fail threshold" not in r.get("distribution_policy",""): raise SystemExit("cross-year descriptive-only policy missing")
          print({"status":"PASS","report_hash":r["report_hash"],"identity_stable":True,"locked_context_zero":True})
          PY
      - name: Prepare release-gated closure candidate and next-group handoff
        run: |
          python "$GROUP8_ROOT/code/group8_prepare_closure_candidate.py" \
            --group8-root "$GROUP8_ROOT" \
            --cross-year "$GROUP8_ROOT/reports/50_CROSS_YEAR_VALIDATION.json" \
            --final-audit-output "$GROUP8_ROOT/reports/51_FINAL_INDEPENDENT_AUDIT.json" \
            --next-group-output "$GROUP8_ROOT/NEXT_GROUP_DEPENDENCY_MANIFEST.json" \
            --candidate-output "$GROUP8_ROOT/CLOSURE_CANDIDATE_MANIFEST.json" \
            --handoff-output "$GROUP8_ROOT/12_HANDOFF_REQUIREMENTS.md"
      - name: Independent closure-candidate verification
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("MoeBot_Trading_System/Group_8");s=json.loads((root/"STATUS.json").read_text());b=json.loads((root/"ENGINE_BUILD_MANIFEST.json").read_text());a=json.loads((root/"reports/51_FINAL_INDEPENDENT_AUDIT.json").read_text());n=json.loads((root/"NEXT_GROUP_DEPENDENCY_MANIFEST.json").read_text());c=json.loads((root/"CLOSURE_CANDIDATE_MANIFEST.json").read_text())
          engine=b["identities"]["engine"]["sha256"];validator=b["identities"]["annual_validator"]["sha256"]
          if a.get("status")!="PASS" or int(a.get("format_version",0))<2: raise SystemExit("final independent audit invalid")
          if a.get("checks",{}).get("locked_context_zero_both_years") is not True or a.get("checks",{}).get("annual_validator_stable") is not True: raise SystemExit("final identity audit invalid")
          if n.get("status")!="FROZEN_HANDOFF_PENDING_RELEASE_VERIFICATION" or int(n.get("format_version",0))<2: raise SystemExit("next-group handoff candidate invalid")
          if n.get("engine_sha256")!=engine or n.get("annual_validator_sha256")!=validator or n.get("closed_blocking_gap_id")!="G8-ICT-LOCKED-CONTEXT-005": raise SystemExit("handoff technical identity drift")
          if n.get("required_release_tag")!="moebot-group8-v0.8.0" or n.get("consumption_policy",{}).get("read_only") is not True or n.get("consumption_policy",{}).get("preserve_locked_context_fix") is not True: raise SystemExit("handoff policy invalid")
          for y in ("2023","2024"):
              rec=n.get("annual_database_assets",{}).get(y,{})
              for k in ("release_asset_name","compressed_size_bytes","compressed_sha256","database_filename","database_size_bytes","database_sha256","database_logical_sha256","source_workflow_run_id","source_artifact_name"):
                  if rec.get(k) in (None,""): raise SystemExit(f"missing handoff annual asset identity:{y}:{k}")
          if c.get("status")!="CLOSURE_CANDIDATE_RELEASE_REQUIRED" or int(c.get("format_version",0))<2 or c.get("officially_closed") is not False or c.get("release_publication_verified") is not False: raise SystemExit("closure candidate invalid")
          if c.get("engine_sha256")!=engine or c.get("annual_validator_sha256")!=validator or c.get("closed_blocking_gap_id")!="G8-ICT-LOCKED-CONTEXT-005": raise SystemExit("closure-candidate identity drift")
          if c.get("next_group_dependency_manifest_hash")!=n.get("manifest_hash") or c.get("final_audit_hash")!=a.get("report_hash"): raise SystemExit("closure-candidate provenance mismatch")
          if s.get("officially_closed") is not False or s.get("next_group_start_authorized") is not False or s.get("status")!="CLOSURE_CANDIDATE_RELEASE_REQUIRED": raise SystemExit("closure-candidate status invalid")
          print({"status":"PASS","candidate_hash":c["candidate_hash"],"next_group_manifest_hash":n["manifest_hash"],"final_audit_hash":a["report_hash"],"release_required":True})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: group8-cross-year-closure-candidate
          path: |
            ${{ env.GROUP8_ROOT }}/reports/50_CROSS_YEAR_VALIDATION.json
            ${{ env.GROUP8_ROOT }}/reports/51_FINAL_INDEPENDENT_AUDIT.json
            ${{ env.GROUP8_ROOT }}/NEXT_GROUP_DEPENDENCY_MANIFEST.json
            ${{ env.GROUP8_ROOT }}/CLOSURE_CANDIDATE_MANIFEST.json
            ${{ env.GROUP8_ROOT }}/12_HANDOFF_REQUIREMENTS.md
            ${{ env.GROUP8_ROOT }}/STATUS.json
          retention-days: 90
      - name: Commit verified cross-year and closure-candidate evidence
        if: github.event_name == 'pull_request' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "$GROUP8_ROOT/reports/50_CROSS_YEAR_VALIDATION.json" \
            "$GROUP8_ROOT/reports/51_FINAL_INDEPENDENT_AUDIT.json" \
            "$GROUP8_ROOT/NEXT_GROUP_DEPENDENCY_MANIFEST.json" \
            "$GROUP8_ROOT/CLOSURE_CANDIDATE_MANIFEST.json" \
            "$GROUP8_ROOT/12_HANDOFF_REQUIREMENTS.md" \
            "$GROUP8_ROOT/STATUS.json"
          git diff --cached --check
          git commit -m "Validate Group 8 cross-year and prepare closure candidate [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
