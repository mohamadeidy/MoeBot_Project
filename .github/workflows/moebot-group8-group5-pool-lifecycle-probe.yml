name: MoeBot Group 8 Group5 Pool Lifecycle Probe
"on":
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/group8_group5_pool_lifecycle_probe.py"
permissions:
  contents: write
env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight exact amended 2023-only state
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('MoeBot_Trading_System/Group_8');s=json.loads((r/'STATUS.json').read_text());e='a52cc93ec2071526c4edba78db00c7313dfb47a712a1a0f5defd76c55cac58f7'
          assert hashlib.sha256((r/'code/moebot_group8_engine_v0_8_0.py').read_bytes()).hexdigest()==e
          assert s['annual_execution_2023_authorized'] is True and s['annual_execution_2024_authorized'] is False and s['officially_closed'] is False
          PY
          python -m py_compile .github/scripts/group8_group5_pool_lifecycle_probe.py "$GROUP8_ROOT/code/group8_materialize_inputs.py"
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Restore and inspect exact 2023 Group5 package
        run: |
          PYTHONPATH="$GROUP8_ROOT/code" python .github/scripts/group8_group5_pool_lifecycle_probe.py --group8-root "$GROUP8_ROOT" --work-dir "$RUNNER_TEMP/g8-g5" --report "$GROUP8_ROOT/reports/39D_GROUP5_POOL_LIFECYCLE_PROBE.json"
      - name: Verify report and no mutation
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('MoeBot_Trading_System/Group_8/reports/39D_GROUP5_POOL_LIFECYCLE_PROBE.json');r=json.loads(p.read_text());q=dict(r);h=q.pop('report_hash');assert hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()==h;assert r['status']=='PASS';assert r['observations']['oos_2024_accessed'] is False
          print({'status':'PASS','pool_status_classes':len(r['pool_status_distribution']),'2024_accessed':False})
          PY
          git diff --exit-code origin/main -- "$GROUP8_ROOT/STATUS.json" "$GROUP8_ROOT/ENGINE_BUILD_MANIFEST.json" "$GROUP8_ROOT/FROZEN_CONFIG.json" "$GROUP8_ROOT/01_DEFINITION_REGISTRY.json" "$GROUP8_ROOT/DESIGN_FREEZE_MANIFEST.json" "$GROUP8_ROOT/02_SCHEMA.sql"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group8-group5-pool-lifecycle-probe
          path: ${{ env.GROUP8_ROOT }}/reports/39D_GROUP5_POOL_LIFECYCLE_PROBE.json
      - name: Commit evidence
        if: github.event_name == 'pull_request' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GROUP8_ROOT/reports/39D_GROUP5_POOL_LIFECYCLE_PROBE.json"
          git commit -m "Record Group 8 Group5 pool lifecycle probe [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
