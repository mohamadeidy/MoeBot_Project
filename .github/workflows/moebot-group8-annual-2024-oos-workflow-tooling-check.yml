name: MoeBot Group 8 2024 OOS Workflow Tooling Check

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_ANNUAL_2024_OOS_WORKFLOW_TOOLING_CHECK.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  PYTHONUNBUFFERED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify dormant OOS workflow syntax and guards
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/moebot-group8-annual-2024-oos-validation.yml"); puts "YAML PASS"'
          test ! -f "$GROUP8_ROOT/TRIGGER_ANNUAL_2024_OOS_VALIDATION.txt"
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/moebot-group8-annual-2024-oos-validation.yml')
          t=p.read_text()
          required=[
            'OOS_FREEZE_MANIFEST.json',
            'OOS_2024_FROZEN_AND_AUTHORIZED',
            'annual_execution_2024_authorized',
            'annual_execution_2023_authorized',
            'annual_validator_sha256',
            'G8-ICT-LOCKED-CONTEXT-005',
            '2023_locked_context_violations',
            '--year 2024',
            'ANNUAL_2024_OOS_VALIDATION_MANIFEST.json',
            'group8-annual-2024-oos-candidate',
            'ANNUAL_2024_OOS_PASS_CROSS_YEAR_REQUIRED',
          ]
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit(f'missing OOS workflow guards:{missing}')
          forbidden=['TRIGGER_ANNUAL_2023_VALIDATION.txt','--year 2023 \\']
          hits=[x for x in forbidden if x in t]
          if hits: raise SystemExit(f'forbidden OOS workflow content:{hits}')
          print({'status':'PASS','required_guards':len(required),'real_2024_trigger_absent':True})
          PY
      - name: Compile all referenced OOS implementation and audit tools
        run: |
          python -m py_compile \
            "$GROUP8_ROOT/code/group8_materialize_inputs.py" \
            "$GROUP8_ROOT/code/moebot_group8_engine_v0_8_0.py" \
            "$GROUP8_ROOT/code/group8_postprocess_v0_8_0.py" \
            "$GROUP8_ROOT/code/group8_sqlite_fingerprint.py" \
            "$GROUP8_ROOT/code/group8_annual_validation.py" \
            "$GROUP8_ROOT/code/group8_finalize_annual_2024_oos.py"
      - name: Run OOS freeze cross-year and closure regressions
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: |
          python "$GROUP8_ROOT/tests/test_group8_oos_freeze.py"
          python "$GROUP8_ROOT/tests/test_group8_oos_crossyear_closure.py"
      - name: Re-run technical lifecycle and annual validation regressions
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: |
          python "$GROUP8_ROOT/tests/test_group8_engine_v0_8_0.py"
          python "$GROUP8_ROOT/tests/test_group8_lifecycle_persistence_v0_8_0.py"
          python "$GROUP8_ROOT/tests/test_group8_annual_validation_tooling.py"
