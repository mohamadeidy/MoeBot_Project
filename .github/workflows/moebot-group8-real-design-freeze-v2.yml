name: MoeBot Group 8 Real Design Freeze v2

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_REAL_DESIGN_FREEZE_V2.txt"
  workflow_dispatch:

permissions:
  contents: write

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  DATA_VAULT_ROOT: MoeBot_Trading_System/Data_Vault
  PYTHONUNBUFFERED: "1"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify coherent registry and compile freeze tooling
        run: |
          python -m py_compile \
            "$GROUP8_ROOT/code/group8_real_design_intake_year_v2.py" \
            "$GROUP8_ROOT/code/group8_verify_coherent_v3_pack.py" \
            "$GROUP8_ROOT/code/group8_real_schema_intake.py" \
            "$GROUP8_ROOT/code/group8_categorical_intake.py" \
            "$GROUP8_ROOT/code/group8_merge_categorical_dictionary.py" \
            "$GROUP8_ROOT/code/group8_build_coherent_adapter_map.py" \
            "$GROUP8_ROOT/code/group8_build_value_bindings.py" \
            "$GROUP8_ROOT/code/group8_validate_design_references.py" \
            "$GROUP8_ROOT/code/group8_design_contract_audit_v3.py" \
            "$GROUP8_ROOT/code/group8_freeze_design_v3.py"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("MoeBot_Trading_System/Group_8")
          required=[root/"UPSTREAM_ANNUAL_DEPENDENCY_REGISTRY.json",root/"UPSTREAM_COHERENT_V3_LINEAGE_AMENDMENT.json",root/"UPSTREAM_SOURCE_SEMANTICS_EVIDENCE.json",root/"01_DEFINITION_REGISTRY_CANDIDATE_v2.json",root/"02_SCHEMA_CANDIDATE_v3.sql",root/"FROZEN_CONFIG_DRAFT.json",root/"contracts/UPSTREAM_INPUT_CONTRACT_DRAFT.json",root/"reports/10_DESIGN_CONTRACT_AUDIT_V3.json"]
          missing=[str(p) for p in required if not p.is_file()]
          if missing: raise SystemExit(f"missing freeze prerequisites: {missing}")
          reg=json.loads((root/"UPSTREAM_ANNUAL_DEPENDENCY_REGISTRY.json").read_text())
          lin=json.loads((root/"UPSTREAM_COHERENT_V3_LINEAGE_AMENDMENT.json").read_text())
          sem=json.loads((root/"UPSTREAM_SOURCE_SEMANTICS_EVIDENCE.json").read_text())
          audit=json.loads((root/"reports/10_DESIGN_CONTRACT_AUDIT_V3.json").read_text())
          gates=[reg.get("status")=="PASS",lin.get("status")=="PASS_COHERENT_DEPENDENCY_LINEAGE",reg.get("lineage_amendment_hash")==lin.get("amendment_hash"),sem.get("status")=="PASS" and not sem.get("failures"),audit.get("status")=="PASS",set(reg.get("years",{}))=={"2023","2024"}]
          if not all(gates): raise SystemExit(f"freeze preflight failed: {gates}")
          print({"status":"PASS","registry_hash":reg["registry_hash"],"lineage":reg["logical_lineage_id"]})
          PY

  intake-year:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        year: [2023, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Run source-only disk-safe annual design intake
        run: |
          python "$GROUP8_ROOT/code/group8_real_design_intake_year_v2.py" \
            --year "${{ matrix.year }}" \
            --group8-root "$GROUP8_ROOT" \
            --data-vault-root "$DATA_VAULT_ROOT" \
            --work-dir "$RUNNER_TEMP/intake-${{ matrix.year }}" \
            --evidence-dir "$RUNNER_TEMP/evidence-${{ matrix.year }}"
      - uses: actions/upload-artifact@v4
        with:
          name: group8-real-design-intake-v2-${{ matrix.year }}
          path: ${{ runner.temp }}/evidence-${{ matrix.year }}
          retention-days: 90
      - name: Cleanup annual intake workspace
        if: always()
        run: rm -rf "$RUNNER_TEMP/intake-${{ matrix.year }}" || true

  freeze:
    needs: [preflight, intake-year]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: group8-real-design-intake-v2-*
          path: ${{ runner.temp }}/intake
      - name: Revalidate annual evidence against permanent registry
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"intake"
          reg=json.loads(Path("MoeBot_Trading_System/Group_8/UPSTREAM_ANNUAL_DEPENDENCY_REGISTRY.json").read_text())
          for year in ("2023","2024"):
              clean=next(root.rglob(f"COHERENT_CLEANROOM_{year}.json"));d=json.loads(clean.read_text())
              src=next(root.rglob(f"SOURCE_SCHEMA_{year}.json"));s=json.loads(src.read_text())
              intake=next(root.rglob(f"REAL_DEPENDENCY_INTAKE_{year}.json"));i=json.loads(intake.read_text())
              if d.get("status")!="PASS" or d.get("report_hash")!=reg["years"][year]["clean_room"]["report_hash"]: raise SystemExit(f"annual clean-room mismatch {year}")
              if s.get("status")!="pass" or i.get("status")!="PASS" or i.get("registry_hash")!=reg["registry_hash"]: raise SystemExit(f"annual source/intake mismatch {year}")
          print({"status":"PASS","years":[2023,2024]})
          PY
      - name: Build exact coherent cross-year adapter map
        run: |
          python "$GROUP8_ROOT/code/group8_build_coherent_adapter_map.py" \
            --registry "$GROUP8_ROOT/UPSTREAM_ANNUAL_DEPENDENCY_REGISTRY.json" \
            --cleanroom-2023 "$(find "$RUNNER_TEMP/intake" -name 'COHERENT_CLEANROOM_2023.json' -print -quit)" \
            --cleanroom-2024 "$(find "$RUNNER_TEMP/intake" -name 'COHERENT_CLEANROOM_2024.json' -print -quit)" \
            --source-schema-2023 "$(find "$RUNNER_TEMP/intake" -name 'SOURCE_SCHEMA_2023.json' -print -quit)" \
            --source-schema-2024 "$(find "$RUNNER_TEMP/intake" -name 'SOURCE_SCHEMA_2024.json' -print -quit)" \
            --output "$GROUP8_ROOT/UPSTREAM_ADAPTER_MAP.json"
      - name: Merge categorical dictionaries and source-verified bindings
        run: |
          python "$GROUP8_ROOT/code/group8_merge_categorical_dictionary.py" \
            --reports-dir "$RUNNER_TEMP/intake" \
            --output "$GROUP8_ROOT/UPSTREAM_CATEGORICAL_DICTIONARY.json"
          python "$GROUP8_ROOT/code/group8_build_value_bindings.py" \
            --categorical-dictionary "$GROUP8_ROOT/UPSTREAM_CATEGORICAL_DICTIONARY.json" \
            --source-semantics "$GROUP8_ROOT/UPSTREAM_SOURCE_SEMANTICS_EVIDENCE.json" \
            --output "$GROUP8_ROOT/UPSTREAM_VALUE_BINDINGS.json"
      - name: Resolve every frozen definition reference
        run: |
          python "$GROUP8_ROOT/code/group8_validate_design_references.py" \
            --definitions "$GROUP8_ROOT/01_DEFINITION_REGISTRY_CANDIDATE_v2.json" \
            --config "$GROUP8_ROOT/FROZEN_CONFIG_DRAFT.json" \
            --bindings "$GROUP8_ROOT/UPSTREAM_VALUE_BINDINGS.json" \
            --output "$GROUP8_ROOT/DESIGN_REFERENCE_RESOLUTION.json"
      - name: Independent coherent-only design audit v3
        run: |
          python "$GROUP8_ROOT/code/group8_design_contract_audit_v3.py" \
            --root "$GROUP8_ROOT" \
            --schema "$GROUP8_ROOT/02_SCHEMA_CANDIDATE_v3.sql" \
            --output "$GROUP8_ROOT/reports/12_REAL_DESIGN_CONTRACT_AUDIT_V3.json"
      - name: Freeze Group 8 v0.8.0 design
        run: |
          python "$GROUP8_ROOT/code/group8_freeze_design_v3.py" \
            --group8-root "$GROUP8_ROOT" \
            --annual-registry "$GROUP8_ROOT/UPSTREAM_ANNUAL_DEPENDENCY_REGISTRY.json" \
            --lineage-amendment "$GROUP8_ROOT/UPSTREAM_COHERENT_V3_LINEAGE_AMENDMENT.json" \
            --adapter-map "$GROUP8_ROOT/UPSTREAM_ADAPTER_MAP.json" \
            --categorical-dictionary "$GROUP8_ROOT/UPSTREAM_CATEGORICAL_DICTIONARY.json" \
            --value-bindings "$GROUP8_ROOT/UPSTREAM_VALUE_BINDINGS.json" \
            --reference-resolution "$GROUP8_ROOT/DESIGN_REFERENCE_RESOLUTION.json" \
            --source-semantics "$GROUP8_ROOT/UPSTREAM_SOURCE_SEMANTICS_EVIDENCE.json" \
            --design-audit "$GROUP8_ROOT/reports/12_REAL_DESIGN_CONTRACT_AUDIT_V3.json"
      - name: Independent final freeze verification
        run: |
          python - <<'PY'
          import hashlib,json,sqlite3
          from pathlib import Path
          root=Path("MoeBot_Trading_System/Group_8")
          status=json.loads((root/"STATUS.json").read_text());manifest=json.loads((root/"DESIGN_FREEZE_MANIFEST.json").read_text());cfg=json.loads((root/"FROZEN_CONFIG.json").read_text());defs=json.loads((root/"01_DEFINITION_REGISTRY.json").read_text());contract=json.loads((root/"contracts/UPSTREAM_INPUT_CONTRACT.json").read_text())
          if status.get("design_frozen") is not True or status.get("engine_build_authorized") is not True: raise SystemExit("status did not authorize engine build")
          if status.get("annual_execution_2023_authorized") or status.get("annual_execution_2024_authorized"): raise SystemExit("annual execution prematurely authorized")
          if manifest.get("status")!="FROZEN" or manifest.get("rejected_bridge_policy")!="NO_UPSTREAM_ID_BRIDGE": raise SystemExit("freeze manifest invalid")
          if len(defs.get("definitions",{}))!=45 or cfg.get("config_id")!=defs.get("config_id"): raise SystemExit("definition/config drift")
          if contract.get("status")!="FROZEN": raise SystemExit("upstream contract not frozen")
          schema=(root/"02_SCHEMA.sql").read_text();con=sqlite3.connect(":memory:");con.executescript(schema);tables={r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")};con.close()
          if "upstream_id_bridge" in tables: raise SystemExit("rejected bridge leaked into frozen schema")
          report={"format_version":2,"status":"PASS","phase":"REAL_DESIGN_FREEZE_V2","design_freeze_hash":manifest["design_freeze_hash"],"config_id":cfg["config_id"],"definition_registry_hash":defs["registry_hash"],"upstream_contract_hash":contract["contract_hash"],"schema_sha256":hashlib.sha256(schema.encode()).hexdigest(),"definition_count":45,"bridge_absent":True,"annual_execution_2023_authorized":False,"annual_execution_2024_authorized":False,"source_only_intake":True}
          report["report_hash"]=hashlib.sha256(json.dumps(report,sort_keys=True,separators=(",",":")).encode()).hexdigest();(root/"reports/13_REAL_DESIGN_FREEZE_VERIFICATION.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n");print(report)
          PY
      - name: Preserve frozen design artifact
        uses: actions/upload-artifact@v4
        with:
          name: group8-real-design-freeze-v2
          path: |
            ${{ env.GROUP8_ROOT }}/00_DESIGN_LOCK.md
            ${{ env.GROUP8_ROOT }}/01_DEFINITION_REGISTRY.json
            ${{ env.GROUP8_ROOT }}/02_SCHEMA.sql
            ${{ env.GROUP8_ROOT }}/FROZEN_CONFIG.json
            ${{ env.GROUP8_ROOT }}/DESIGN_FREEZE_MANIFEST.json
            ${{ env.GROUP8_ROOT }}/STATUS.json
            ${{ env.GROUP8_ROOT }}/UPSTREAM_ADAPTER_MAP.json
            ${{ env.GROUP8_ROOT }}/UPSTREAM_CATEGORICAL_DICTIONARY.json
            ${{ env.GROUP8_ROOT }}/UPSTREAM_VALUE_BINDINGS.json
            ${{ env.GROUP8_ROOT }}/DESIGN_REFERENCE_RESOLUTION.json
            ${{ env.GROUP8_ROOT }}/contracts/UPSTREAM_INPUT_CONTRACT.json
            ${{ env.GROUP8_ROOT }}/reports/12_REAL_DESIGN_CONTRACT_AUDIT_V3.json
            ${{ env.GROUP8_ROOT }}/reports/13_REAL_DESIGN_FREEZE_VERIFICATION.json
          retention-days: 90
      - name: Commit verified frozen design to PR branch
        if: github.event_name == 'pull_request' && success()
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          mkdir -p "$RUNNER_TEMP/frozen-final/reports" "$RUNNER_TEMP/frozen-final/contracts"
          for f in 00_DESIGN_LOCK.md 01_DEFINITION_REGISTRY.json 02_SCHEMA.sql FROZEN_CONFIG.json DESIGN_FREEZE_MANIFEST.json STATUS.json UPSTREAM_ADAPTER_MAP.json UPSTREAM_CATEGORICAL_DICTIONARY.json UPSTREAM_VALUE_BINDINGS.json DESIGN_REFERENCE_RESOLUTION.json; do cp "$GROUP8_ROOT/$f" "$RUNNER_TEMP/frozen-final/$f"; done
          cp "$GROUP8_ROOT/contracts/UPSTREAM_INPUT_CONTRACT.json" "$RUNNER_TEMP/frozen-final/contracts/"
          cp "$GROUP8_ROOT/reports/12_REAL_DESIGN_CONTRACT_AUDIT_V3.json" "$RUNNER_TEMP/frozen-final/reports/"
          cp "$GROUP8_ROOT/reports/13_REAL_DESIGN_FREEZE_VERIFICATION.json" "$RUNNER_TEMP/frozen-final/reports/"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          mkdir -p "$GROUP8_ROOT/reports" "$GROUP8_ROOT/contracts"
          cp -a "$RUNNER_TEMP/frozen-final/." "$GROUP8_ROOT/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GROUP8_ROOT/00_DESIGN_LOCK.md" "$GROUP8_ROOT/01_DEFINITION_REGISTRY.json" "$GROUP8_ROOT/02_SCHEMA.sql" "$GROUP8_ROOT/FROZEN_CONFIG.json" "$GROUP8_ROOT/DESIGN_FREEZE_MANIFEST.json" "$GROUP8_ROOT/STATUS.json" "$GROUP8_ROOT/UPSTREAM_ADAPTER_MAP.json" "$GROUP8_ROOT/UPSTREAM_CATEGORICAL_DICTIONARY.json" "$GROUP8_ROOT/UPSTREAM_VALUE_BINDINGS.json" "$GROUP8_ROOT/DESIGN_REFERENCE_RESOLUTION.json" "$GROUP8_ROOT/contracts/UPSTREAM_INPUT_CONTRACT.json" "$GROUP8_ROOT/reports/12_REAL_DESIGN_CONTRACT_AUDIT_V3.json" "$GROUP8_ROOT/reports/13_REAL_DESIGN_FREEZE_VERIFICATION.json"
          git commit -m "Freeze Group 8 v0.8.0 coherent design v2 [skip ci]"
          git push origin "HEAD:$HEAD_BRANCH"
