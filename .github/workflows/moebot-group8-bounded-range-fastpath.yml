name: MoeBot Group 8 Bounded Range Fast Path

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_BOUNDED_RANGE_FASTPATH.txt"
permissions:
  contents: read
env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  PYTHONUNBUFFERED: "1"
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Preflight free-only 2023
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('MoeBot_Trading_System/Group_8/STATUS.json').read_text());assert s['annual_execution_2023_authorized'] and not s['annual_execution_2024_authorized'];assert not s['free_only_policy']['paid_runner_allowed'] and not s['free_only_policy']['paid_service_allowed'];print({'status':'PASS','free_only':True,'2024_oos':False})
          PY
      - name: Compile bounded-range fast path
        run: python -m py_compile "$GROUP8_ROOT/code/group8_bounded_range_fastpath.py" "$GROUP8_ROOT/tests/test_group8_bounded_range_fastpath.py"
      - name: Prove exact bounded-range ID hash parity
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: python -m unittest "$GROUP8_ROOT/tests/test_group8_bounded_range_fastpath.py"
      - name: Audit frozen surfaces unchanged
        run: git diff --exit-code origin/main -- "$GROUP8_ROOT/FROZEN_CONFIG.json" "$GROUP8_ROOT/01_DEFINITION_REGISTRY.json" "$GROUP8_ROOT/02_SCHEMA.sql" "$GROUP8_ROOT/DESIGN_FREEZE_MANIFEST.json" "$GROUP8_ROOT/SHARDED_STORAGE_CONTRACT.json" "$GROUP8_ROOT/code/moebot_group8_engine_v0_8_0.py" "$GROUP8_ROOT/STATUS.json"
