name: MoeBot Group 8 Source Snapshot

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_SOURCE_SNAPSHOT.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build read-only source snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot/.github/workflows" "$RUNNER_TEMP/snapshot/MoeBot_Trading_System"
          cp -a MoeBot_Trading_System/Group_8 "$RUNNER_TEMP/snapshot/MoeBot_Trading_System/"
          find .github/workflows -maxdepth 1 -type f -iname '*group8*' -exec cp {} "$RUNNER_TEMP/snapshot/.github/workflows/" \;
          find MoeBot_Trading_System/archive/groups_2_6_frozen_runtime_bundle_v2 -maxdepth 1 -type f -exec cp {} "$RUNNER_TEMP/snapshot/MoeBot_Trading_System/" \;
          find MoeBot_Trading_System/archive/groups_2_6_frozen_runtime_bundle_v3 -maxdepth 1 -type f -exec cp {} "$RUNNER_TEMP/snapshot/MoeBot_Trading_System/" \;
          find MoeBot_Trading_System/Group_7/registry -maxdepth 1 -type f -exec cp {} "$RUNNER_TEMP/snapshot/MoeBot_Trading_System/" \;
          find MoeBot_Trading_System/Data_Vault/registry -maxdepth 1 -type f -exec cp {} "$RUNNER_TEMP/snapshot/MoeBot_Trading_System/" \;
          find "$RUNNER_TEMP/snapshot" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/snapshot/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: group8-source-snapshot
          path: ${{ runner.temp }}/snapshot
          retention-days: 30
