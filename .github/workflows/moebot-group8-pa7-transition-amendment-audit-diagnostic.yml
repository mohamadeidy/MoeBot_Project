name: MoeBot Group 8 PA7 Transition Amendment Audit Diagnostic

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_PA7_TRANSITION_EVENT_AMENDMENT.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8

jobs:
  audit-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply amendment in diagnostic workspace
        run: python "$GROUP8_ROOT/code/group8_apply_pa7_transition_event_amendment.py" --group8-root "$GROUP8_ROOT"
      - name: Verify report self hash
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path("MoeBot_Trading_System/Group_8/reports/37_PA7_TRANSITION_EVENT_DESIGN_AMENDMENT.json").read_text()); saved=p.pop("report_hash")
          actual=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest()
          print({"saved":saved,"actual":actual}); assert saved==actual
          PY
      - name: Verify registry self hash and PA7 versions
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path("MoeBot_Trading_System/Group_8/01_DEFINITION_REGISTRY.json").read_text()); saved=p.pop("registry_hash")
          actual=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest()
          print({"saved":saved,"actual":actual}); assert saved==actual
          expected={"pa_breakout_exact":"PA7E.2","pa_breakout_atr_buffer":"PA7A.2","pa_breakout_point_buffer":"PA7P.2"}
          for k,v in expected.items():
            d=p["definitions"][k]; print(k,d.get("version"),d.get("state_key")); assert d.get("version")==v; assert d.get("persistent_state_records_forbidden") is True
          PY
      - name: Verify design freeze self hash and lineage
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=json.loads(Path("MoeBot_Trading_System/Group_8/DESIGN_FREEZE_MANIFEST.json").read_text()); saved=p.pop("design_freeze_hash")
          actual=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest()
          print({"saved":saved,"actual":actual,"registry":p.get("definition_registry_hash")}); assert saved==actual
          PY
      - name: Verify fail-closed status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("MoeBot_Trading_System/Group_8/STATUS.json").read_text()); print(json.dumps(s.get("blocking_gap"),indent=2,sort_keys=True)); print(s.get("status"))
          assert s.get("annual_execution_2023_authorized") is False; assert s.get("annual_execution_2024_authorized") is False; assert s.get("engine_build_authorized") is False
          assert s.get("blocking_gap",{}).get("status")=="FIXED_PENDING_TECHNICAL_REFREEZE"; assert s.get("blocking_gap",{}).get("decision_required") is False
          PY
      - name: Verify frozen surfaces unchanged
        run: |
          git diff --exit-code origin/main -- \
            "$GROUP8_ROOT/FROZEN_CONFIG.json" \
            "$GROUP8_ROOT/02_SCHEMA.sql" \
            "$GROUP8_ROOT/UPSTREAM_ADAPTER_MAP.json" \
            "$GROUP8_ROOT/UPSTREAM_VALUE_BINDINGS.json" \
            "$GROUP8_ROOT/contracts/UPSTREAM_INPUT_CONTRACT.json" \
            "$GROUP8_ROOT/UPSTREAM_ANNUAL_DEPENDENCY_REGISTRY.json"
