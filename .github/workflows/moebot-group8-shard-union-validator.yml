name: MoeBot Group 8 Shard Union Validator

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_SHARD_UNION_VALIDATOR.txt"

permissions:
  contents: read

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile union validator
        run: |
          python -m py_compile "$GROUP8_ROOT/code/group8_shard_union_validator.py" "$GROUP8_ROOT/tests/test_group8_shard_union_validator.py"
      - name: Run union validation regression
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: |
          python -m unittest "$GROUP8_ROOT/tests/test_group8_shard_union_validator.py"
      - name: Verify no frozen surfaces changed
        run: |
          git diff --exit-code origin/main -- \
            "$GROUP8_ROOT/FROZEN_CONFIG.json" "$GROUP8_ROOT/01_DEFINITION_REGISTRY.json" "$GROUP8_ROOT/02_SCHEMA.sql" \
            "$GROUP8_ROOT/DESIGN_FREEZE_MANIFEST.json" "$GROUP8_ROOT/SHARDED_STORAGE_CONTRACT.json" "$GROUP8_ROOT/STATUS.json" \
            "$GROUP8_ROOT/code/moebot_group8_engine_v0_8_0.py" "$GROUP8_ROOT/contracts/UPSTREAM_INPUT_CONTRACT.json"
