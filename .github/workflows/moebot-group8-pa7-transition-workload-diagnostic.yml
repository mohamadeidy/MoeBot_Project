name: MoeBot Group 8 PA7 Transition Event Workload Diagnostic

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_PA7_TRANSITION_WORKLOAD_DIAGNOSTIC.txt"
  workflow_dispatch:

permissions:
  contents: write

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  PYTHONUNBUFFERED: "1"

jobs:
  exact-partial-2023:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight exact refrozen amended candidate
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("MoeBot_Trading_System/Group_8");s=json.loads((root/"STATUS.json").read_text());m=json.loads((root/"ENGINE_BUILD_MANIFEST.json").read_text());e="a52cc93ec2071526c4edba78db00c7313dfb47a712a1a0f5defd76c55cac58f7"
          if hashlib.sha256((root/"code/moebot_group8_engine_v0_8_0.py").read_bytes()).hexdigest()!=e or m.get("identities",{}).get("engine",{}).get("sha256")!=e: raise SystemExit("exact amended engine identity mismatch")
          if s.get("engine_build",{}).get("status")!="TECHNICAL_CANDIDATE_PASS" or s.get("annual_execution_2023_authorized") is not True: raise SystemExit("2023 technical candidate not authorized")
          if s.get("annual_execution_2024_authorized") is not False or s.get("officially_closed") is not False: raise SystemExit("OOS/closure boundary invalid")
          if m.get("closed_blocking_gap",{}).get("gap_id")!="G8-PA7-ENUMERATION-EXPLOSION-007" or m.get("closed_blocking_gap",{}).get("resolution")!="PA7_TRANSITION_EVENT_ENUMERATION": raise SystemExit("Gap007 amendment not refrozen")
          print({"status":"PASS","engine_sha256":e,"2023_authorized":True,"2024_authorized":False})
          PY
          python -m py_compile \
            .github/scripts/group8_breakout_partial_stage.py \
            .github/scripts/group8_ephemeral_staging_indexes.py \
            .github/scripts/group8_transition_breakout_workload.py \
            "$GROUP8_ROOT/code/group8_materialize_inputs.py" \
            "$GROUP8_ROOT/code/moebot_group8_engine_v0_8_0.py"

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Materialize exact relevant authorized 2023 slices
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code
        run: |
          mkdir -p "$RUNNER_TEMP/g8-transition-workload/work" "$RUNNER_TEMP/g8-transition-workload/reports"
          python .github/scripts/group8_breakout_partial_stage.py \
            --group8-root "$GROUP8_ROOT" --year 2023 \
            --output-db "$RUNNER_TEMP/g8-transition-workload/staging.sqlite" \
            --work-dir "$RUNNER_TEMP/g8-transition-workload/work" \
            --report "$RUNNER_TEMP/g8-transition-workload/reports/PARTIAL_STAGING.json"
          python .github/scripts/group8_ephemeral_staging_indexes.py \
            --database "$RUNNER_TEMP/g8-transition-workload/staging.sqlite" \
            --year 2023 --phase post-pa7-transition-workload \
            --output "$RUNNER_TEMP/g8-transition-workload/reports/STAGING_INDEX_REPORT.json"

      - name: Execute exact amended PA7 transition workload
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code
        run: |
          python .github/scripts/group8_transition_breakout_workload.py \
            --group8-root "$GROUP8_ROOT" \
            --staging-db "$RUNNER_TEMP/g8-transition-workload/staging.sqlite" \
            --output-db "$RUNNER_TEMP/g8-transition-workload/output.sqlite" \
            --year 2023 \
            --report "$GROUP8_ROOT/reports/39_PA7_TRANSITION_WORKLOAD_DIAGNOSTIC.json"

      - name: Independent scope cardinality and no-OOS verification
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("MoeBot_Trading_System/Group_8");r=json.loads((root/"reports/39_PA7_TRANSITION_WORKLOAD_DIAGNOSTIC.json").read_text());p=dict(r);h=p.pop("report_hash")
          actual=hashlib.sha256(json.dumps(p,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest()
          if h!=actual or r.get("status")!="PASS": raise SystemExit("diagnostic hash/status failure")
          if r.get("engine_sha256")!="a52cc93ec2071526c4edba78db00c7313dfb47a712a1a0f5defd76c55cac58f7": raise SystemExit("engine identity mismatch")
          if r.get("definition_registry_hash")!="70d1d4d873249ba73a20ece3d26de90054db171d28af68b4fafc5d9806173ec9" or r.get("design_freeze_hash")!="7cc865da6712c343bdaeb7fce4bb9f93ce2ddf117c45367e13b8dc637e29e1b4": raise SystemExit("amended design identity mismatch")
          obs=r.get("observations",{})
          if any(obs.get(k) for k in ("engine_changed","definitions_changed","thresholds_changed","schema_changed","upstream_changed","authorization_changed","oos_2024_accessed")): raise SystemExit("forbidden mutation/access declared")
          if r.get("transition_candidate_count",0)>=r.get("pre_amendment_group6_plus_group8_candidate_lower_bound",0): raise SystemExit("transition amendment did not reduce partial-scope candidate count")
          if r.get("sqlite_quick_check")!="ok": raise SystemExit("output sqlite quick_check failed")
          print({"status":"PASS","transition_candidates":r["transition_candidate_count"],"reduction_fraction":r["candidate_reduction_fraction_vs_pre_amendment_lower_bound"],"breakout_seconds":r["stage_seconds"]["breakouts"],"2024_accessed":False})
          PY
          git diff --exit-code origin/main -- \
            "$GROUP8_ROOT/STATUS.json" \
            "$GROUP8_ROOT/ENGINE_BUILD_MANIFEST.json" \
            "$GROUP8_ROOT/00_DESIGN_LOCK.md" \
            "$GROUP8_ROOT/DESIGN_FREEZE_MANIFEST.json" \
            "$GROUP8_ROOT/FROZEN_CONFIG.json" \
            "$GROUP8_ROOT/01_DEFINITION_REGISTRY.json" \
            "$GROUP8_ROOT/02_SCHEMA.sql" \
            "$GROUP8_ROOT/contracts/UPSTREAM_INPUT_CONTRACT.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group8-pa7-transition-workload-diagnostic
          path: |
            ${{ env.GROUP8_ROOT }}/reports/39_PA7_TRANSITION_WORKLOAD_DIAGNOSTIC.json
            ${{ runner.temp }}/g8-transition-workload/reports
          retention-days: 30

      - name: Commit permanent transition workload evidence
        if: github.event_name == 'pull_request' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GROUP8_ROOT/reports/39_PA7_TRANSITION_WORKLOAD_DIAGNOSTIC.json"
          git diff --cached --check
          git commit -m "Record Group 8 PA7 transition workload diagnostic [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Cleanup disposable diagnostic data
        if: always()
        run: rm -rf "$RUNNER_TEMP/g8-transition-workload" || true
