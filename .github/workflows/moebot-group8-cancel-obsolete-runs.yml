name: MoeBot Group 8 Cancel Obsolete Free Runs

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_CANCEL_OBSOLETE_RUNS.txt"

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Cancel only superseded Group 8 executions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          uname -m
          for RUN_ID in 30243494474 30256391297; do
            echo "Cancelling superseded run ${RUN_ID}"
            curl -fsS -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel" || true
          done
          echo "Only superseded x64 Group 8 runs were targeted."
