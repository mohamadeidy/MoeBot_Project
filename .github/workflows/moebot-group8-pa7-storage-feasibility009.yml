name: MoeBot Group 8 Free Runner Capacity Probe

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_PA7_STORAGE_FEASIBILITY009.txt"

permissions:
  contents: write

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  PYTHONUNBUFFERED: "1"

jobs:
  free-capacity-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight exact current Group 8 technical candidate
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('MoeBot_Trading_System/Group_8');s=json.loads((r/'STATUS.json').read_text());m=json.loads((r/'ENGINE_BUILD_MANIFEST.json').read_text());e='44e0c1bd9dc0e32bcb00a0ee0363754d45282fcee3d81a2170f9fa6ed6cb441b'
          assert hashlib.sha256((r/'code/moebot_group8_engine_v0_8_0.py').read_bytes()).hexdigest()==e
          assert m['status']=='TECHNICAL_CANDIDATE_PASS' and m['identities']['engine']['sha256']==e
          assert s['annual_execution_2023_authorized'] is True and s['annual_execution_2024_authorized'] is False and s['officially_closed'] is False
          print({'status':'PASS','engine_sha256':e,'free_only_probe':True,'oos_2024':False})
          PY
          python -m py_compile "$GROUP8_ROOT/code/group8_free_capacity_probe.py"

      - name: Record runner disk before free cleanup
        run: |
          echo '=== DF BEFORE ==='
          df -h /
          echo '=== LARGE PREINSTALLED DIRECTORIES ==='
          sudo du -sh /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true

      - name: Reclaim only unused preinstalled runner tooling
        run: |
          docker system prune -af || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          echo '=== DF AFTER FREE CLEANUP ==='
          df -h /

      - name: Run free-only capacity proof
        run: |
          python "$GROUP8_ROOT/code/group8_free_capacity_probe.py" \
            --group8-root "$GROUP8_ROOT" \
            --output "$GROUP8_ROOT/reports/43B_FREE_RUNNER_CAPACITY_PROBE.json"

      - name: Independent capacity report verification
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('MoeBot_Trading_System/Group_8/reports/43B_FREE_RUNNER_CAPACITY_PROBE.json');r=json.loads(p.read_text());q=dict(r);saved=q.pop('report_hash')
          actual=hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          assert saved==actual and r['status']=='PASS'
          assert r['fixed_text_bytes_per_transition']==401
          assert r['structural_lower_bound_bytes']==54413814*401
          assert r['policy']=={'free_only':True,'paid_runner_allowed':False,'paid_service_allowed':False}
          assert r['oos_2024_accessed'] is False
          print({'status':'PASS','free_gb':r['runner_filesystem_free_bytes']/1e9,'structural_lower_bound_gb':r['structural_lower_bound_decimal_gb'],'remaining_after_structural_gb':r['remaining_free_bytes_after_structural_bound']/1e9})
          PY
          git diff --exit-code origin/main -- \
            "$GROUP8_ROOT/STATUS.json" "$GROUP8_ROOT/ENGINE_BUILD_MANIFEST.json" \
            "$GROUP8_ROOT/00_DESIGN_LOCK.md" "$GROUP8_ROOT/DESIGN_FREEZE_MANIFEST.json" "$GROUP8_ROOT/FROZEN_CONFIG.json" \
            "$GROUP8_ROOT/01_DEFINITION_REGISTRY.json" "$GROUP8_ROOT/02_SCHEMA.sql" "$GROUP8_ROOT/UPSTREAM_ADAPTER_MAP.json" \
            "$GROUP8_ROOT/UPSTREAM_VALUE_BINDINGS.json" "$GROUP8_ROOT/UPSTREAM_ANNUAL_DEPENDENCY_REGISTRY.json" "$GROUP8_ROOT/contracts/UPSTREAM_INPUT_CONTRACT.json" \
            "$GROUP8_ROOT/code/moebot_group8_engine_v0_8_0.py"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group8-free-runner-capacity-probe
          path: ${{ env.GROUP8_ROOT }}/reports/43B_FREE_RUNNER_CAPACITY_PROBE.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit permanent free capacity evidence
        if: github.event_name == 'pull_request' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GROUP8_ROOT/reports/43B_FREE_RUNNER_CAPACITY_PROBE.json"
          git diff --cached --check
          git commit -m "Record Group 8 free runner capacity probe [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
