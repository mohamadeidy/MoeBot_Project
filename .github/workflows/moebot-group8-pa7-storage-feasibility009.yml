name: MoeBot Group 8 PA7 Storage Feasibility Diagnostic

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_PA7_STORAGE_FEASIBILITY009.txt"

permissions:
  contents: write

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  PYTHONUNBUFFERED: "1"

jobs:
  storage-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight exact lifecycle-corrected technical candidate
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('MoeBot_Trading_System/Group_8');s=json.loads((r/'STATUS.json').read_text());m=json.loads((r/'ENGINE_BUILD_MANIFEST.json').read_text());e='44e0c1bd9dc0e32bcb00a0ee0363754d45282fcee3d81a2170f9fa6ed6cb441b'
          assert hashlib.sha256((r/'code/moebot_group8_engine_v0_8_0.py').read_bytes()).hexdigest()==e
          assert m['status']=='TECHNICAL_CANDIDATE_PASS' and m['identities']['engine']['sha256']==e and m['format_version']==5
          assert m['closed_blocking_gap']['gap_id']=='G8-PA7-LIFECYCLE-RETIREMENT-008'
          assert s['blocking_gap']['gap_id']=='G8-PA7-LIFECYCLE-RETIREMENT-008' and s['blocking_gap']['status']=='CLOSED_BY_TECHNICAL_REFREEZE'
          assert s['annual_execution_2023_authorized'] is True and s['annual_execution_2024_authorized'] is False and s['officially_closed'] is False
          print({'status':'PASS','engine_sha256':e,'2023_authorized':True,'2024_authorized':False})
          PY
          python -m py_compile "$GROUP8_ROOT/code/group8_pa7_storage_feasibility_diagnostic.py"

      - name: Run structural and empirical storage proof
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: |
          df -h /
          python "$GROUP8_ROOT/code/group8_pa7_storage_feasibility_diagnostic.py" \
            --group8-root "$GROUP8_ROOT" \
            --report "$GROUP8_ROOT/reports/43_PA7_STORAGE_FEASIBILITY_DIAGNOSTIC.json"

      - name: Independent proof verification
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('MoeBot_Trading_System/Group_8/reports/43_PA7_STORAGE_FEASIBILITY_DIAGNOSTIC.json');r=json.loads(p.read_text());q=dict(r);h=q.pop('report_hash')
          assert hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()==h
          assert r['status']=='PASS' and r['engine_sha256']=='44e0c1bd9dc0e32bcb00a0ee0363754d45282fcee3d81a2170f9fa6ed6cb441b'
          assert r['partial_transition_count']==54413814
          s=r['structural_text_lower_bound'];assert s['bytes_per_transition']==401 and s['total_bytes']==21819939414
          assert r['standard_public_github_runner']['documented_storage_bytes']==14000000000
          assert r['standard_public_github_runner']['structural_bound_exceeds_documented_storage'] is True
          assert r['mandatory_contract_checks']['write_pattern_forces_creation_state'] is True
          assert r['mandatory_contract_checks']['full_2023_single_database_protocol'] is True
          assert r['empirical_frozen_engine_text_payload']['sample_transition_rows']>0
          assert r['empirical_frozen_engine_text_payload']['combined_text_bytes_min_per_transition']>401
          assert r['conclusion']['standard_public_runner_can_materialize_required_single_database'] is False
          obs=r['observations'];assert obs['oos_2024_accessed'] is False and all(obs[k] is False for k in ('engine_changed','definitions_changed','thresholds_changed','schema_changed','upstream_changed','authorization_changed'))
          print({'status':'PASS','report_hash':h,'structural_lower_bound_gb':s['total_decimal_gb'],'empirical_min_projection_gb':r['empirical_frozen_engine_text_payload']['projected_partial_decimal_gb_using_sample_min'],'runner_snapshot_free_gb':r['diagnostic_runner_snapshot']['filesystem_free_bytes']/1e9})
          PY
          git diff --exit-code origin/main -- \
            "$GROUP8_ROOT/STATUS.json" "$GROUP8_ROOT/ENGINE_BUILD_MANIFEST.json" \
            "$GROUP8_ROOT/00_DESIGN_LOCK.md" "$GROUP8_ROOT/DESIGN_FREEZE_MANIFEST.json" "$GROUP8_ROOT/FROZEN_CONFIG.json" \
            "$GROUP8_ROOT/01_DEFINITION_REGISTRY.json" "$GROUP8_ROOT/02_SCHEMA.sql" "$GROUP8_ROOT/UPSTREAM_ADAPTER_MAP.json" \
            "$GROUP8_ROOT/UPSTREAM_VALUE_BINDINGS.json" "$GROUP8_ROOT/UPSTREAM_ANNUAL_DEPENDENCY_REGISTRY.json" "$GROUP8_ROOT/contracts/UPSTREAM_INPUT_CONTRACT.json" \
            "$GROUP8_ROOT/code/moebot_group8_engine_v0_8_0.py"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group8-pa7-storage-feasibility009
          path: ${{ env.GROUP8_ROOT }}/reports/43_PA7_STORAGE_FEASIBILITY_DIAGNOSTIC.json
          retention-days: 30

      - name: Commit permanent storage feasibility evidence
        if: github.event_name == 'pull_request' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GROUP8_ROOT/reports/43_PA7_STORAGE_FEASIBILITY_DIAGNOSTIC.json"
          git diff --cached --check
          git commit -m "Record Group 8 PA7 storage feasibility diagnostic [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
