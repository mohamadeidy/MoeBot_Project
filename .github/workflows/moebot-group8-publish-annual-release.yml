name: MoeBot Group 8 Publish Verified Annual Release

"on":
  push:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_RELEASE_PUBLICATION.txt"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  RELEASE_TAG: moebot-group8-v0.8.0
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  publish-and-redownload-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight closure candidate and frozen handoff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("MoeBot_Trading_System/Group_8")
          s=json.loads((root/"STATUS.json").read_text());c=json.loads((root/"CLOSURE_CANDIDATE_MANIFEST.json").read_text());n=json.loads((root/"NEXT_GROUP_DEPENDENCY_MANIFEST.json").read_text());a=json.loads((root/"reports/51_FINAL_INDEPENDENT_AUDIT.json").read_text())
          if s.get("officially_closed") is not False or s.get("status")!="CLOSURE_CANDIDATE_RELEASE_REQUIRED": raise SystemExit("wrong release-publication phase")
          if c.get("status")!="CLOSURE_CANDIDATE_RELEASE_REQUIRED" or c.get("officially_closed") is not False: raise SystemExit("closure candidate invalid")
          if n.get("status")!="FROZEN_HANDOFF_PENDING_RELEASE_VERIFICATION" or n.get("required_release_tag")!="moebot-group8-v0.8.0": raise SystemExit("handoff/release tag invalid")
          if a.get("status")!="PASS" or a.get("checks",{}).get("locked_context_zero_both_years") is not True: raise SystemExit("final pre-release audit invalid")
          for y in ("2023","2024"):
              r=n.get("annual_database_assets",{}).get(y,{})
              for k in ("release_asset_name","compressed_size_bytes","compressed_sha256","source_workflow_run_id","source_artifact_name"):
                  if r.get(k) in (None,""): raise SystemExit(f"missing {y} release source identity:{k}")
          print({"status":"PASS","candidate_hash":c["candidate_hash"],"next_group_manifest_hash":n["manifest_hash"]})
          PY
      - name: Download exact annual Actions artifacts
        run: |
          set -euo pipefail
          MANIFEST="$GROUP8_ROOT/NEXT_GROUP_DEPENDENCY_MANIFEST.json"
          RUN23=$(jq -r '.annual_database_assets["2023"].source_workflow_run_id' "$MANIFEST")
          RUN24=$(jq -r '.annual_database_assets["2024"].source_workflow_run_id' "$MANIFEST")
          ART23=$(jq -r '.annual_database_assets["2023"].source_artifact_name' "$MANIFEST")
          ART24=$(jq -r '.annual_database_assets["2024"].source_artifact_name' "$MANIFEST")
          mkdir -p "$RUNNER_TEMP/g8-release/source/2023" "$RUNNER_TEMP/g8-release/source/2024"
          gh run download "$RUN23" --repo "$GITHUB_REPOSITORY" -n "$ART23" -D "$RUNNER_TEMP/g8-release/source/2023"
          gh run download "$RUN24" --repo "$GITHUB_REPOSITORY" -n "$ART24" -D "$RUNNER_TEMP/g8-release/source/2024"
      - name: Verify source artifact SHA and size before publication
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("MoeBot_Trading_System/Group_8");m=json.loads((root/"NEXT_GROUP_DEPENDENCY_MANIFEST.json").read_text());base=Path(os.environ["RUNNER_TEMP"])/"g8-release/source"
          found={}
          for year in ("2023","2024"):
              e=m["annual_database_assets"][year];matches=list((base/year).rglob(e["release_asset_name"]))
              if len(matches)!=1: raise SystemExit(f"expected exactly one source asset for {year}, found {len(matches)}")
              p=matches[0];h=hashlib.sha256(p.read_bytes()).hexdigest()
              if p.stat().st_size!=int(e["compressed_size_bytes"]) or h!=e["compressed_sha256"]: raise SystemExit(f"source artifact identity mismatch:{year}")
              found[year]=str(p)
          (Path(os.environ["RUNNER_TEMP"])/"g8-release/source_paths.json").write_text(json.dumps(found))
          print({"status":"PASS","source_assets":found})
          PY
      - name: Create immutable release or verify existing tag target
        run: |
          set -euo pipefail
          MANIFEST="$GROUP8_ROOT/NEXT_GROUP_DEPENDENCY_MANIFEST.json"
          NAME23=$(jq -r '.annual_database_assets["2023"].release_asset_name' "$MANIFEST")
          NAME24=$(jq -r '.annual_database_assets["2024"].release_asset_name' "$MANIFEST")
          A23=$(jq -r '.["2023"]' "$RUNNER_TEMP/g8-release/source_paths.json")
          A24=$(jq -r '.["2024"]' "$RUNNER_TEMP/g8-release/source_paths.json")
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --force
            TARGET=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$TARGET" != "$GITHUB_SHA" ]; then
              echo "Existing release tag points to $TARGET, expected $GITHUB_SHA" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" "$A23" "$A24" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MoeBot Group 8 v0.8.0 Frozen Annual Outputs" --notes "Authoritative frozen Group 8 annual outputs. Consume only after verification against NEXT_GROUP_DEPENDENCY_MANIFEST.json. No trading outputs; 2024 is frozen OOS."
          fi
      - name: Re-download both release assets
        run: |
          set -euo pipefail
          MANIFEST="$GROUP8_ROOT/NEXT_GROUP_DEPENDENCY_MANIFEST.json"
          NAME23=$(jq -r '.annual_database_assets["2023"].release_asset_name' "$MANIFEST")
          NAME24=$(jq -r '.annual_database_assets["2024"].release_asset_name' "$MANIFEST")
          mkdir -p "$RUNNER_TEMP/g8-release/redownload/2023" "$RUNNER_TEMP/g8-release/redownload/2024"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -p "$NAME23" -D "$RUNNER_TEMP/g8-release/redownload/2023" --clobber
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -p "$NAME24" -D "$RUNNER_TEMP/g8-release/redownload/2024" --clobber
      - name: Finalize deterministic release publication evidence
        run: |
          set -euo pipefail
          MANIFEST="$GROUP8_ROOT/NEXT_GROUP_DEPENDENCY_MANIFEST.json"
          NAME23=$(jq -r '.annual_database_assets["2023"].release_asset_name' "$MANIFEST")
          NAME24=$(jq -r '.annual_database_assets["2024"].release_asset_name' "$MANIFEST")
          A23=$(jq -r '.["2023"]' "$RUNNER_TEMP/g8-release/source_paths.json")
          A24=$(jq -r '.["2024"]' "$RUNNER_TEMP/g8-release/source_paths.json")
          R23="$RUNNER_TEMP/g8-release/redownload/2023/$NAME23"
          R24="$RUNNER_TEMP/g8-release/redownload/2024/$NAME24"
          RELEASE_URL=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url -q .url)
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" --force
          TARGET=$(git rev-list -n 1 "$RELEASE_TAG")
          python "$GROUP8_ROOT/code/group8_finalize_release_publication.py" --group8-root "$GROUP8_ROOT" --release-url "$RELEASE_URL" --release-target-sha "$TARGET" --asset-2023 "$A23" --asset-2024 "$A24" --redownload-2023 "$R23" --redownload-2024 "$R24" --output "$GROUP8_ROOT/RELEASE_PUBLICATION_MANIFEST.json"
      - name: Independent publication manifest verification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("MoeBot_Trading_System/Group_8");p=json.loads((root/"RELEASE_PUBLICATION_MANIFEST.json").read_text());n=json.loads((root/"NEXT_GROUP_DEPENDENCY_MANIFEST.json").read_text());c=json.loads((root/"CLOSURE_CANDIDATE_MANIFEST.json").read_text())
          if p.get("status")!="PASS" or p.get("release_tag")!="moebot-group8-v0.8.0" or p.get("all_release_assets_redownload_verified") is not True: raise SystemExit("publication manifest not PASS")
          if p.get("candidate_hash")!=c.get("candidate_hash") or p.get("pre_release_next_group_manifest_hash")!=n.get("manifest_hash"): raise SystemExit("publication provenance mismatch")
          if not all(p.get("assets",{}).get(y,{}).get("download_verified") for y in ("2023","2024")): raise SystemExit("release redownload verification missing")
          print({"status":"PASS","report_hash":p["report_hash"],"release_url":p["release_url"]})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: group8-release-publication-evidence
          path: ${{ env.GROUP8_ROOT }}/RELEASE_PUBLICATION_MANIFEST.json
          retention-days: 90
      - name: Push publication evidence branch for review and merge
        run: |
          set -euo pipefail
          BRANCH="group8-release-publication-evidence-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$GROUP8_ROOT/RELEASE_PUBLICATION_MANIFEST.json"
          git diff --cached --check
          git commit -m "Verify Group 8 annual release publication [skip ci]"
          git push origin "$BRANCH"
          echo "Publication evidence branch: $BRANCH"
      - name: Cleanup downloaded annual assets
        if: always()
        run: rm -rf "$RUNNER_TEMP/g8-release" || true
