name: MoeBot Group 8 PA7 Annual 2023 Free ARM64 Release

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_PA7_ANNUAL_2023_ARM.txt"

permissions:
  contents: write
  actions: read

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  TAG: moebot-group8-pa7-annual-2023-v2-arm
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      worker_count: ${{ steps.matrix.outputs.worker_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove ARM64 exact PA7 parity before annual execution
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: |
          set -euo pipefail
          uname -m
          python "$GROUP8_ROOT/tests/test_group8_pa7_sharded_parity_v0_8_0.py"
          python "$GROUP8_ROOT/tests/test_group8_pa7_transition_event_v0_8_0.py"
          python "$GROUP8_ROOT/tests/test_group8_pa7_lifecycle_retirement_v0_8_0.py"
      - name: Preflight frozen FREE-only Annual 2023 state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('MoeBot_Trading_System/Group_8')
          s=json.loads((r/'STATUS.json').read_text());p=json.loads((r/'reports/51_PA7_2023_REAL_SIZING_AND_BUCKET_PLAN.json').read_text());w=json.loads((r/'reports/52_PA7_2023_ROOT_WINDOW_INVENTORY.json').read_text());c=json.loads((r/'SHARDED_STORAGE_CONTRACT.json').read_text())
          assert s['annual_execution_2023_authorized'] is True and s['annual_execution_2024_authorized'] is False and s['blocking_gap'] is None and s['officially_closed'] is False
          assert s['free_only_policy']['paid_runner_allowed'] is False and s['free_only_policy']['paid_service_allowed'] is False
          assert c['free_only_policy']['paid_runner_allowed'] is False and c['free_only_policy']['paid_service_allowed'] is False
          assert p['status']=='PASS' and p['free_only'] and not p['oos_2024_accessed']
          assert w['status']=='PASS' and w['free_only'] and not w['oos_2024_accessed']
          assert w['all_observed_root_windows']==[f'2023-{m:02d}' for m in range(1,13)]
          assert p['worker_policy'].startswith('one worker per timeframe/scope/bucket_index')
          print({'status':'PASS','runner':'ubuntu-24.04-arm','free_only':True,'annual_2023':True,'2024_oos':False})
          PY
      - id: matrix
        name: Build one-bucket-per-worker matrix from frozen plan
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=Path('MoeBot_Trading_System/Group_8');plan=json.loads((r/'reports/51_PA7_2023_REAL_SIZING_AND_BUCKET_PLAN.json').read_text())['frozen_bucket_plan'];inv=json.loads((r/'reports/52_PA7_2023_ROOT_WINDOW_INVENTORY.json').read_text())['inventory']
          include=[]
          for tf in ('M1','M5','M15','M30','H1','H4','D1'):
            for scope in ('upstream','group8_range'):
              if not inv[tf][scope]['root_windows']: continue
              count=int(plan[tf][scope])
              for bucket in range(count):
                include.append({'worker_id':f'{tf}-{scope}-{bucket:03d}','timeframe':tf,'scope':scope,'bucket_count':count,'bucket_index':bucket})
          assert len(include)<=256
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('matrix='+json.dumps({'include':include},separators=(',',':'))+'\n');f.write(f'worker_count={len(include)}\n')
          print(json.dumps({'worker_count':len(include)},indent=2))
          PY
      - name: Ensure free ARM prerelease container exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "MoeBot Group 8 PA7 Annual 2023 v2 ARM" --notes "FREE-ONLY lossless PA7 Annual 2023 on standard GitHub ARM64 runners. 2024 OOS untouched."
          fi

  shard-workers:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      WORKER_ID: ${{ matrix.worker_id }}
      TF: ${{ matrix.timeframe }}
      SCOPE: ${{ matrix.scope }}
      BUCKET_COUNT: ${{ matrix.bucket_count }}
      BUCKET_INDEX: ${{ matrix.bucket_index }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight worker and reclaim free ARM runner storage
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,platform
          from pathlib import Path
          r=Path('MoeBot_Trading_System/Group_8');s=json.loads((r/'STATUS.json').read_text());p=json.loads((r/'reports/51_PA7_2023_REAL_SIZING_AND_BUCKET_PLAN.json').read_text());w=json.loads((r/'reports/52_PA7_2023_ROOT_WINDOW_INVENTORY.json').read_text())
          assert s['annual_execution_2023_authorized'] and not s['annual_execution_2024_authorized']
          assert not s['free_only_policy']['paid_runner_allowed'] and not s['free_only_policy']['paid_service_allowed']
          assert int(os.environ['BUCKET_COUNT'])==int(p['frozen_bucket_plan'][os.environ['TF']][os.environ['SCOPE']])
          assert 0<=int(os.environ['BUCKET_INDEX'])<int(os.environ['BUCKET_COUNT'])
          assert w['inventory'][os.environ['TF']][os.environ['SCOPE']]['root_windows']
          print({'status':'PASS','worker':os.environ['WORKER_ID'],'machine':platform.machine(),'free_only':True,'2024_oos':False})
          PY
          docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          df -h /
      - name: Restore verified reusable compact PA7 staging
        run: |
          mkdir -p "$RUNNER_TEMP/pa7/payload"
          curl -fL --retry 6 --retry-delay 2 "https://github.com/mohamadeidy/MoeBot_Project/releases/download/moebot-group8-pa7-staging-2023-v1/MoeBot_Group8_PA7_2023_COMPACT_STAGING_v1.sqlite.zst" -o "$RUNNER_TEMP/pa7/staging.sqlite.zst"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          m=json.loads(Path('MoeBot_Trading_System/Group_8/reports/47_PA7_2023_COMPACT_STAGING_RELEASE.json').read_text());p=Path(os.environ['RUNNER_TEMP'])/'pa7/staging.sqlite.zst'
          h=hashlib.sha256(p.read_bytes()).hexdigest();assert h==m['compressed_sha256'] and p.stat().st_size==m['compressed_size_bytes'];print({'status':'PASS','compressed_sha256':h})
          PY
          zstd -q -d -f "$RUNNER_TEMP/pa7/staging.sqlite.zst" -o "$RUNNER_TEMP/pa7/staging.sqlite"
          rm -f "$RUNNER_TEMP/pa7/staging.sqlite.zst"
      - name: Materialize all causal-root months for this one frozen bucket
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code
        run: |
          set -euo pipefail
          python - <<'PY' > "$RUNNER_TEMP/pa7/windows.txt"
          import json,os
          from pathlib import Path
          r=json.loads(Path('MoeBot_Trading_System/Group_8/reports/52_PA7_2023_ROOT_WINDOW_INVENTORY.json').read_text());print('\n'.join(r['inventory'][os.environ['TF']][os.environ['SCOPE']]['root_windows']))
          PY
          while read -r MONTH; do
            B="$BUCKET_INDEX"; PAD=$(printf '%03d' "$B"); CNT=$(printf '%03d' "$BUCKET_COUNT"); BASE="g8pa7_2023_${TF}_${SCOPE}_${MONTH}_b${PAD}of${CNT}"
            python "$GROUP8_ROOT/code/group8_pa7_annual_shard_executor.py" --staging-db "$RUNNER_TEMP/pa7/staging.sqlite" --work-db "$RUNNER_TEMP/pa7/work.sqlite" --output-db "$RUNNER_TEMP/pa7/payload/${BASE}.sqlite" --artifacts-root "$GROUP8_ROOT" --year 2023 --symbol XAUUSD_ --timeframe "$TF" --root-month "$MONTH" --bucket-count "$BUCKET_COUNT" --bucket-index "$B" --boundary-scope "$SCOPE" --manifest "$RUNNER_TEMP/pa7/payload/${BASE}.manifest.json"
            python - "$RUNNER_TEMP/pa7/payload/${BASE}.sqlite" "$RUNNER_TEMP/pa7/payload/${BASE}.manifest.json" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          db=Path(sys.argv[1]);mp=Path(sys.argv[2]);m=json.loads(mp.read_text());q=dict(m);saved=q.pop('manifest_hash');stable=lambda v:hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          assert stable(q)==saved and m['status']=='PASS' and m['year']==2023 and not m['oos_2024_accessed'] and m['annual_breakout_followup_finalized'] is True
          assert m['file_size_bytes']==db.stat().st_size<=2_500_000_000 and hashlib.sha256(db.read_bytes()).hexdigest()==m['sha256']
          PY
            rm -f "$RUNNER_TEMP/pa7/work.sqlite"
          done < "$RUNNER_TEMP/pa7/windows.txt"
      - name: Package release-safe worker bundle and report
        run: |
          tar -C "$RUNNER_TEMP/pa7" -cf - payload | zstd -q -3 -T0 | split -b 1750000000 -d -a 3 - "$RUNNER_TEMP/pa7/${WORKER_ID}.tar.zst.part-"
          python - <<'PY'
          import hashlib,json,os
          from collections import Counter
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'pa7';mans=[];defs=Counter();raw=cands=states=0
          def sha(p):
            h=hashlib.sha256()
            with p.open('rb') as f:
              for x in iter(lambda:f.read(16*1024*1024),b''):h.update(x)
            return h.hexdigest()
          for p in sorted((base/'payload').glob('*.manifest.json')):
            m=json.loads(p.read_text());mans.append({'shard_id':m['shard_id'],'filename':p.name.replace('.manifest.json','.sqlite'),'manifest_filename':p.name,'timeframe':m['timeframe'],'boundary_scope':m['boundary_scope'],'causal_root_window':m['causal_root_window'],'bucket_index':m['bucket_index'],'bucket_count':m['bucket_count'],'file_size_bytes':m['file_size_bytes'],'sha256':m['sha256'],'manifest_hash':m['manifest_hash'],'table_row_counts':m['table_row_counts'],'table_logical_sha256':m['table_logical_sha256'],'definition_coverage':m['definition_coverage']});raw+=int(m['file_size_bytes']);cands+=int(m['table_row_counts'].get('price_action_pattern_candidate',0));states+=int(m['table_row_counts'].get('price_action_pattern_state',0));defs.update({k:int(v) for k,v in m['definition_coverage'].items()})
          parts=[]
          for p in sorted(base.glob(os.environ['WORKER_ID']+'.tar.zst.part-*')):
            assert p.stat().st_size<1_800_000_000;parts.append({'filename':p.name,'size_bytes':p.stat().st_size,'sha256':sha(p),'url':f"https://github.com/mohamadeidy/MoeBot_Project/releases/download/{os.environ['TAG']}/{p.name}"})
          b=int(os.environ['BUCKET_INDEX']);rec={'format_version':3,'status':'PASS','worker_id':os.environ['WORKER_ID'],'year':2023,'timeframe':os.environ['TF'],'scope':os.environ['SCOPE'],'bucket_count':int(os.environ['BUCKET_COUNT']),'bucket_start':b,'bucket_end':b,'shard_count':len(mans),'raw_shard_bytes':raw,'candidate_rows':cands,'state_rows':states,'definition_coverage':dict(sorted(defs.items())),'shards':mans,'bundle_parts':parts,'report_asset':os.environ['WORKER_ID']+'.json','runner_class':'STANDARD_GITHUB_HOSTED_ARM64','free_only':True,'paid_runner_used':False,'paid_service_used':False,'oos_2024_accessed':False};stable=lambda v:hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest();rec['report_hash']=stable(rec);(base/(os.environ['WORKER_ID']+'.json')).write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          print({'status':'PASS','worker':rec['worker_id'],'shards':len(mans),'parts':len(parts),'raw_bytes':raw})
          PY
      - name: Upload immutable worker bundle to free public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/pa7/${WORKER_ID}.tar.zst.part-"* "$RUNNER_TEMP/pa7/${WORKER_ID}.json" --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: pa7-arm-worker-report-${{ matrix.worker_id }}
          path: ${{ runner.temp }}/pa7/${{ matrix.worker_id }}.json
          retention-days: 7

  aggregate:
    needs: [prepare, shard-workers]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: pa7-arm-worker-report-*
          path: ${{ runner.temp }}/pa7-reports
          merge-multiple: true
      - name: Fetch release inventory and prove complete once-only coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/pa7-assets.json"
          python - <<'PY'
          import hashlib,json,os
          from collections import Counter
          from pathlib import Path
          root=Path('MoeBot_Trading_System/Group_8');plan=json.loads((root/'reports/51_PA7_2023_REAL_SIZING_AND_BUCKET_PLAN.json').read_text())['frozen_bucket_plan'];inv=json.loads((root/'reports/52_PA7_2023_ROOT_WINDOW_INVENTORY.json').read_text())['inventory'];reports=[json.loads(p.read_text()) for p in sorted((Path(os.environ['RUNNER_TEMP'])/'pa7-reports').glob('*.json'))];assert reports
          expected=set()
          for tf in ('M1','M5','M15','M30','H1','H4','D1'):
            for scope in ('upstream','group8_range'):
              for month in inv[tf][scope]['root_windows']:
                for b in range(int(plan[tf][scope])):expected.add((tf,scope,month,b,int(plan[tf][scope])))
          actual={};defs=Counter();raw=cands=states=0;bundles=[]
          stable=lambda v:hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          for wr in reports:
            assert wr['status']=='PASS' and wr['runner_class']=='STANDARD_GITHUB_HOSTED_ARM64' and wr['free_only'] and not wr['paid_runner_used'] and not wr['paid_service_used'] and not wr['oos_2024_accessed'];q=dict(wr);saved=q.pop('report_hash');assert stable(q)==saved
            bundles.append({'worker_id':wr['worker_id'],'parts':wr['bundle_parts'],'report_asset':wr['report_asset'],'report_hash':saved})
            for s in wr['shards']:
              key=(s['timeframe'],s['boundary_scope'],s['causal_root_window'],int(s['bucket_index']),int(s['bucket_count']))
              if key in actual:raise SystemExit(f'duplicate shard key:{key}')
              actual[key]=s;raw+=int(s['file_size_bytes']);cands+=int(s['table_row_counts'].get('price_action_pattern_candidate',0));states+=int(s['table_row_counts'].get('price_action_pattern_state',0));defs.update({k:int(v) for k,v in s['definition_coverage'].items()})
          missing=sorted(expected-set(actual));extra=sorted(set(actual)-expected)
          if missing or extra:raise SystemExit(f'coverage mismatch missing={len(missing)} extra={len(extra)} sample={missing[:3]}/{extra[:3]}')
          assets=json.loads((Path(os.environ['RUNNER_TEMP'])/'pa7-assets.json').read_text())['assets'];asset_names={a['name'] for a in assets};required={x['report_asset'] for x in bundles}
          for bundle in bundles:required.update(p['filename'] for p in bundle['parts'])
          absent=sorted(required-asset_names)
          if absent:raise SystemExit(f'release assets missing:{absent[:10]}')
          shards=[]
          for key in sorted(actual):
            s=actual[key];shards.append({'timeframe':key[0],'scope':key[1],'root_window':key[2],'bucket_index':key[3],'bucket_count':key[4],'shard_id':s['shard_id'],'filename':s['filename'],'manifest_filename':s['manifest_filename'],'file_size_bytes':s['file_size_bytes'],'sha256':s['sha256'],'manifest_hash':s['manifest_hash'],'table_row_counts':s['table_row_counts'],'table_logical_sha256':s['table_logical_sha256'],'definition_coverage':s['definition_coverage']})
          rec={'format_version':3,'status':'PASS','artifact_kind':'GROUP8_PA7_ANNUAL_2023_SHARDED_RELEASE','year':2023,'release_tag':os.environ['TAG'],'runner_class':'STANDARD_GITHUB_HOSTED_ARM64','worker_count':len(reports),'shard_count':len(actual),'expected_shard_count':len(expected),'raw_shard_bytes':raw,'candidate_rows':cands,'state_rows':states,'definition_coverage':dict(sorted(defs.items())),'bucket_plan':plan,'root_window_inventory_report_hash':json.loads((root/'reports/52_PA7_2023_ROOT_WINDOW_INVENTORY.json').read_text())['report_hash'],'sizing_report_hash':json.loads((root/'reports/51_PA7_2023_REAL_SIZING_AND_BUCKET_PLAN.json').read_text())['report_hash'],'bundles':bundles,'shards':shards,'complete_once_only_coverage':True,'free_only':True,'paid_runner_used':False,'paid_service_used':False,'oos_2024_accessed':False};rec['report_hash']=stable(rec);(root/'reports/53_PA7_ANNUAL_2023_RELEASE.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n');print({'status':'PASS','workers':len(reports),'shards':len(actual),'candidate_rows':cands,'state_rows':states,'report_hash':rec['report_hash']})
          PY
      - name: Commit official PA7 Annual 2023 ARM release index
        run: |
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GROUP8_ROOT/reports/53_PA7_ANNUAL_2023_RELEASE.json";git diff --cached --check
          git commit -m "Record Group 8 PA7 Annual 2023 free ARM sharded release [skip ci]";git push origin "HEAD:${{ github.head_ref }}"
