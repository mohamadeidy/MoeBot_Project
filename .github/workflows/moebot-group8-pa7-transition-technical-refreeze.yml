name: MoeBot Group 8 PA7 Transition Event Technical Refreeze

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_PA7_TRANSITION_TECHNICAL_REFREEZE.txt"
  workflow_dispatch:

permissions:
  contents: write

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  PYTHONUNBUFFERED: "1"

jobs:
  audit-refreeze:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight exact amended fixed-pending-refreeze state
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("MoeBot_Trading_System/Group_8")
          s=json.loads((root/"STATUS.json").read_text()); a=json.loads((root/"reports/37_PA7_TRANSITION_EVENT_DESIGN_AMENDMENT.json").read_text())
          e="a52cc93ec2071526c4edba78db00c7313dfb47a712a1a0f5defd76c55cac58f7"
          if hashlib.sha256((root/"code/moebot_group8_engine_v0_8_0.py").read_bytes()).hexdigest()!=e: raise SystemExit("amended engine drift")
          if s.get("status")!="PA7_TRANSITION_EVENT_DESIGN_AMENDMENT_APPLIED_PENDING_TECHNICAL_REFREEZE": raise SystemExit("wrong refreeze phase")
          b=s.get("blocking_gap",{})
          if b.get("gap_id")!="G8-PA7-ENUMERATION-EXPLOSION-007" or b.get("status")!="FIXED_PENDING_TECHNICAL_REFREEZE" or b.get("decision_required") is not False: raise SystemExit("Gap007 refreeze precondition mismatch")
          if any(s.get(k) for k in ("engine_build_authorized","annual_execution_authorized","annual_execution_2023_authorized","annual_execution_2024_authorized")): raise SystemExit("execution must remain revoked")
          if a.get("report_hash")!="591fff2d535cd27326f37a97ae4278c2a20505101ad8a032804dc657f1866996" or a.get("oos_2024_accessed") is not False: raise SystemExit("amendment evidence mismatch")
          print({"status":"PASS","engine_sha256":e,"2023_authorized":False,"2024_authorized":False})
          PY
          git diff --exit-code origin/main -- \
            "$GROUP8_ROOT/00_DESIGN_LOCK.md" \
            "$GROUP8_ROOT/DESIGN_FREEZE_MANIFEST.json" \
            "$GROUP8_ROOT/FROZEN_CONFIG.json" \
            "$GROUP8_ROOT/01_DEFINITION_REGISTRY.json" \
            "$GROUP8_ROOT/02_SCHEMA.sql" \
            "$GROUP8_ROOT/UPSTREAM_ADAPTER_MAP.json" \
            "$GROUP8_ROOT/UPSTREAM_VALUE_BINDINGS.json" \
            "$GROUP8_ROOT/UPSTREAM_ANNUAL_DEPENDENCY_REGISTRY.json" \
            "$GROUP8_ROOT/contracts/UPSTREAM_INPUT_CONTRACT.json"

      - name: Compile amended audit and refreeze tooling
        run: |
          python -m py_compile \
            "$GROUP8_ROOT/code/moebot_group8_engine_v0_8_0.py" \
            "$GROUP8_ROOT/code/group8_postprocess_v0_8_0.py" \
            "$GROUP8_ROOT/code/group8_technical_candidate_audit.py" \
            "$GROUP8_ROOT/code/group8_pa7_transition_technical_audit.py" \
            "$GROUP8_ROOT/code/group8_refreeze_engine_build_after_pa7_transition.py" \
            "$GROUP8_ROOT/tests/test_group8_engine_v0_8_0.py" \
            "$GROUP8_ROOT/tests/test_group8_lifecycle_persistence_v0_8_0.py" \
            "$GROUP8_ROOT/tests/test_group8_breakout_timeframe_isolation_v0_8_0.py" \
            "$GROUP8_ROOT/tests/test_group8_pa7_transition_event_v0_8_0.py"

      - name: Retest original technical matrix
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: python "$GROUP8_ROOT/tests/test_group8_engine_v0_8_0.py"

      - name: Retest lifecycle and locked-context matrix
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: python "$GROUP8_ROOT/tests/test_group8_lifecycle_persistence_v0_8_0.py"

      - name: Retest permanent PA7 same-timeframe regression
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: python "$GROUP8_ROOT/tests/test_group8_breakout_timeframe_isolation_v0_8_0.py"

      - name: Retest PA7 transition re-arm variant isolation and idempotence
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: python "$GROUP8_ROOT/tests/test_group8_pa7_transition_event_v0_8_0.py"

      - name: Run full independent technical candidate audit on amended identities
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code
        run: |
          python "$GROUP8_ROOT/code/group8_technical_candidate_audit.py" \
            --group8-root "$GROUP8_ROOT" \
            --output "$GROUP8_ROOT/reports/20_ENGINE_TECHNICAL_CANDIDATE_AUDIT.json"

      - name: Run independent PA7 transition-event technical audit
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code
        run: |
          python "$GROUP8_ROOT/code/group8_pa7_transition_technical_audit.py" \
            --group8-root "$GROUP8_ROOT" \
            --base-technical-audit "$GROUP8_ROOT/reports/20_ENGINE_TECHNICAL_CANDIDATE_AUDIT.json" \
            --output "$GROUP8_ROOT/reports/38_PA7_TRANSITION_EVENT_TECHNICAL_AUDIT.json"

      - name: Re-freeze exact amended technical candidate and authorize 2023 only
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code
        run: |
          python "$GROUP8_ROOT/code/group8_refreeze_engine_build_after_pa7_transition.py" \
            --group8-root "$GROUP8_ROOT" \
            --base-technical-audit "$GROUP8_ROOT/reports/20_ENGINE_TECHNICAL_CANDIDATE_AUDIT.json" \
            --pa7-transition-audit "$GROUP8_ROOT/reports/38_PA7_TRANSITION_EVENT_TECHNICAL_AUDIT.json" \
            --manifest-output "$GROUP8_ROOT/ENGINE_BUILD_MANIFEST.json"

      - name: Independent exact amended refreeze verification
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code
        run: |
          python - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path("MoeBot_Trading_System/Group_8");sys.path.insert(0,str(root/"code"))
          from moebot_group8_engine_v0_8_0 import stable_hash
          s=json.loads((root/"STATUS.json").read_text());m=json.loads((root/"ENGINE_BUILD_MANIFEST.json").read_text());base=json.loads((root/"reports/20_ENGINE_TECHNICAL_CANDIDATE_AUDIT.json").read_text());pa7=json.loads((root/"reports/38_PA7_TRANSITION_EVENT_TECHNICAL_AUDIT.json").read_text())
          e="a52cc93ec2071526c4edba78db00c7313dfb47a712a1a0f5defd76c55cac58f7";rh="70d1d4d873249ba73a20ece3d26de90054db171d28af68b4fafc5d9806173ec9";fh="7cc865da6712c343bdaeb7fce4bb9f93ce2ddf117c45367e13b8dc637e29e1b4"
          for rec,name in ((base,"base"),(pa7,"pa7")):
            p=dict(rec);h=p.pop("report_hash");
            if stable_hash(p)!=h: raise SystemExit(f"{name} audit self-hash mismatch")
          p=dict(m);h=p.pop("manifest_hash")
          if stable_hash(p)!=h: raise SystemExit("manifest self-hash mismatch")
          if m.get("format_version")!=4 or m.get("status")!="TECHNICAL_CANDIDATE_PASS": raise SystemExit("manifest state mismatch")
          if m.get("design_freeze_hash")!=fh or m.get("definition_registry_hash")!=rh: raise SystemExit("amended design identity mismatch")
          if m.get("closed_blocking_gap",{}).get("gap_id")!="G8-PA7-ENUMERATION-EXPLOSION-007" or m.get("closed_blocking_gap",{}).get("resolution")!="PA7_TRANSITION_EVENT_ENUMERATION": raise SystemExit("Gap007 closure mismatch")
          if m.get("previous_closed_blocking_gap",{}).get("gap_id")!="G8-PA7-CROSS-TIMEFRAME-006": raise SystemExit("Gap006 lineage lost")
          if m.get("identities",{}).get("engine",{}).get("sha256")!=e: raise SystemExit("engine identity mismatch")
          for name,ident in m.get("identities",{}).items():
            path=root/ident["path"]
            if not path.is_file() or path.stat().st_size!=int(ident["size_bytes"]) or hashlib.sha256(path.read_bytes()).hexdigest()!=ident["sha256"]: raise SystemExit(f"identity drift:{name}")
          if s.get("engine_build",{}).get("engine_build_manifest_hash")!=m.get("manifest_hash") or s.get("engine_build",{}).get("engine_sha256")!=e: raise SystemExit("STATUS manifest/engine binding mismatch")
          if s.get("blocking_gap",{}).get("status")!="CLOSED_BY_TECHNICAL_REFREEZE": raise SystemExit("Gap007 not closed by refreeze")
          if s.get("engine_build_authorized") is not True or s.get("annual_execution_2023_authorized") is not True or s.get("annual_execution_2024_authorized") is not False: raise SystemExit("authorization boundary invalid")
          if s.get("officially_closed") is not False: raise SystemExit("premature closure")
          print({"status":"PASS","engine_sha256":e,"manifest_hash":m["manifest_hash"],"2023_authorized":True,"2024_authorized":False})
          PY
          git diff --exit-code origin/main -- \
            "$GROUP8_ROOT/00_DESIGN_LOCK.md" \
            "$GROUP8_ROOT/DESIGN_FREEZE_MANIFEST.json" \
            "$GROUP8_ROOT/FROZEN_CONFIG.json" \
            "$GROUP8_ROOT/01_DEFINITION_REGISTRY.json" \
            "$GROUP8_ROOT/02_SCHEMA.sql" \
            "$GROUP8_ROOT/UPSTREAM_ADAPTER_MAP.json" \
            "$GROUP8_ROOT/UPSTREAM_VALUE_BINDINGS.json" \
            "$GROUP8_ROOT/UPSTREAM_ANNUAL_DEPENDENCY_REGISTRY.json" \
            "$GROUP8_ROOT/contracts/UPSTREAM_INPUT_CONTRACT.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group8-pa7-transition-technical-refreeze-evidence
          path: |
            ${{ env.GROUP8_ROOT }}/reports/20_ENGINE_TECHNICAL_CANDIDATE_AUDIT.json
            ${{ env.GROUP8_ROOT }}/reports/38_PA7_TRANSITION_EVENT_TECHNICAL_AUDIT.json
            ${{ env.GROUP8_ROOT }}/ENGINE_BUILD_MANIFEST.json
            ${{ env.GROUP8_ROOT }}/STATUS.json
          retention-days: 30

      - name: Commit exact amended refrozen technical state to PR branch
        if: github.event_name == 'pull_request' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "$GROUP8_ROOT/reports/20_ENGINE_TECHNICAL_CANDIDATE_AUDIT.json" \
            "$GROUP8_ROOT/reports/38_PA7_TRANSITION_EVENT_TECHNICAL_AUDIT.json" \
            "$GROUP8_ROOT/ENGINE_BUILD_MANIFEST.json" \
            "$GROUP8_ROOT/STATUS.json"
          git diff --cached --check
          git commit -m "Re-freeze Group 8 after PA7 transition-event amendment [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
