name: MoeBot Group 8 PA7 Timeframe Isolation Fix

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_FIX_PA7_TIMEFRAME_ISOLATION.txt"
  workflow_dispatch:

permissions:
  contents: write

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  PYTHONUNBUFFERED: "1"

jobs:
  fix-review-retest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight exact authoritative pre-fix state
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("MoeBot_Trading_System/Group_8")
          status=json.loads((root/"STATUS.json").read_text())
          build=json.loads((root/"ENGINE_BUILD_MANIFEST.json").read_text())
          expected="61aa4cb2328b3424008703392501d94d7cbaf5733944e55ae0e45db7926191e8"
          engine=root/"code/moebot_group8_engine_v0_8_0.py"
          if hashlib.sha256(engine.read_bytes()).hexdigest()!=expected:
              raise SystemExit("unexpected authoritative pre-fix engine bytes")
          if build.get("identities",{}).get("engine",{}).get("sha256")!=expected:
              raise SystemExit("engine build manifest is not the expected pre-fix candidate")
          if status.get("design_frozen") is not True or status.get("officially_closed") is not False:
              raise SystemExit("invalid Group 8 phase")
          if status.get("engine_build",{}).get("status")!="TECHNICAL_CANDIDATE_PASS":
              raise SystemExit("pre-fix engine is not the authoritative technical candidate")
          if status.get("annual_execution_2023_authorized") is not True:
              raise SystemExit("2023 must be the currently authorized engineering year before gap revocation")
          if status.get("annual_execution_2024_authorized") is not False:
              raise SystemExit("2024 OOS must remain unauthorized")
          print({"status":"PASS","engine_sha256":expected,"2023_authorized":True,"2024_authorized":False})
          PY

      - name: Apply minimal PA7 same-timeframe correction and revoke stale authorization
        run: |
          python "$GROUP8_ROOT/code/group8_fix_pa7_timeframe_isolation.py" --group8-root "$GROUP8_ROOT"

      - name: Compile implementation and complete Group 8 technical regression set
        run: |
          python -m py_compile \
            "$GROUP8_ROOT/code/group8_fix_pa7_timeframe_isolation.py" \
            "$GROUP8_ROOT/code/moebot_group8_engine_v0_8_0.py" \
            "$GROUP8_ROOT/tests/test_group8_engine_v0_8_0.py" \
            "$GROUP8_ROOT/tests/test_group8_lifecycle_persistence_v0_8_0.py" \
            "$GROUP8_ROOT/tests/test_group8_breakout_timeframe_isolation_v0_8_0.py"

      - name: Run original frozen technical matrix
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: |
          python "$GROUP8_ROOT/tests/test_group8_engine_v0_8_0.py"

      - name: Run strengthened lifecycle and locked-context regression matrix
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: |
          python "$GROUP8_ROOT/tests/test_group8_lifecycle_persistence_v0_8_0.py"

      - name: Run permanent PA7 cross-timeframe regression
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: |
          python "$GROUP8_ROOT/tests/test_group8_breakout_timeframe_isolation_v0_8_0.py"

      - name: Independent gap and frozen-semantics verification
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("MoeBot_Trading_System/Group_8")
          engine_path=root/"code/moebot_group8_engine_v0_8_0.py"
          engine=engine_path.read_text()
          status=json.loads((root/"STATUS.json").read_text())
          diagnostic=json.loads((root/"reports/32_BREAKOUT_TIMEFRAME_GAP_DIAGNOSTIC.json").read_text())
          gap=json.loads((root/"reports/33_BREAKOUT_TIMEFRAME_GAP_ANALYSIS.json").read_text())
          def stable_hash(value):
              value=dict(value);value.pop("report_hash",None)
              return hashlib.sha256(json.dumps(value,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()).hexdigest()
          for name,record in (("diagnostic",diagnostic),("gap",gap)):
              if stable_hash(record)!=record.get("report_hash"):
                  raise SystemExit(f"{name} report self-hash mismatch")
          if diagnostic.get("gap_id")!="G8-PA7-CROSS-TIMEFRAME-006" or diagnostic.get("status")!="FAIL_BLOCKING_GAP_CONFIRMED":
              raise SystemExit("diagnostic identity/status mismatch")
          if gap.get("gap_id")!="G8-PA7-CROSS-TIMEFRAME-006" or gap.get("status")!="BLOCKING_GAP_FIXED_PENDING_TECHNICAL_REFREEZE":
              raise SystemExit("gap analysis identity/status mismatch")
          if gap.get("diagnostic_report_hash")!=diagnostic.get("report_hash"):
              raise SystemExit("gap/diagnostic lineage mismatch")
          if any(gap.get(k) is not False for k in ("definitions_changed","thresholds_changed","schema_changed","upstream_changed","config_changed","2024_accessed")):
              raise SystemExit("forbidden frozen-state mutation declared")
          old='FROM group6__{t} WHERE {avc}<=?'
          new='FROM group6__{t} WHERE timeframe=? AND {avc}<=?'
          if old in engine or engine.count(new)!=1:
              raise SystemExit("Group6 PA7 timeframe predicate is not exact")
          if status.get("status")!="BLOCKING_GAP_G8_PA7_CROSS_TIMEFRAME_FIXED_PENDING_TECHNICAL_REFREEZE":
              raise SystemExit("STATUS phase mismatch")
          if status.get("blocking_gap",{}).get("gap_id")!="G8-PA7-CROSS-TIMEFRAME-006" or status.get("blocking_gap",{}).get("status")!="FIXED_PENDING_REFREEZE":
              raise SystemExit("STATUS blocking-gap identity mismatch")
          if status.get("engine_build_authorized") or status.get("annual_execution_authorized") or status.get("annual_execution_2023_authorized") or status.get("annual_execution_2024_authorized"):
              raise SystemExit("stale execution authorization was not fully revoked")
          corrected=hashlib.sha256(engine_path.read_bytes()).hexdigest()
          if corrected!=gap.get("corrected_engine_sha256") or corrected==gap.get("previous_engine_sha256"):
              raise SystemExit("corrected engine identity mismatch")
          print({"status":"PASS","gap_id":gap["gap_id"],"corrected_engine_sha256":corrected,"all_execution_authorization_revoked":True})
          PY
          git diff --exit-code origin/main -- \
            "$GROUP8_ROOT/00_DESIGN_LOCK.md" \
            "$GROUP8_ROOT/DESIGN_FREEZE_MANIFEST.json" \
            "$GROUP8_ROOT/FROZEN_CONFIG.json" \
            "$GROUP8_ROOT/01_DEFINITION_REGISTRY.json" \
            "$GROUP8_ROOT/02_SCHEMA.sql" \
            "$GROUP8_ROOT/UPSTREAM_ADAPTER_MAP.json" \
            "$GROUP8_ROOT/UPSTREAM_VALUE_BINDINGS.json" \
            "$GROUP8_ROOT/contracts/UPSTREAM_INPUT_CONTRACT.json" \
            "$GROUP8_ROOT/UPSTREAM_ANNUAL_DEPENDENCY_REGISTRY.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group8-pa7-timeframe-isolation-fix-evidence
          path: |
            ${{ env.GROUP8_ROOT }}/reports/32_BREAKOUT_TIMEFRAME_GAP_DIAGNOSTIC.json
            ${{ env.GROUP8_ROOT }}/reports/33_BREAKOUT_TIMEFRAME_GAP_ANALYSIS.json
          retention-days: 30

      - name: Commit corrected candidate state to PR branch
        if: github.event_name == 'pull_request' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "$GROUP8_ROOT/code/moebot_group8_engine_v0_8_0.py" \
            "$GROUP8_ROOT/STATUS.json" \
            "$GROUP8_ROOT/reports/32_BREAKOUT_TIMEFRAME_GAP_DIAGNOSTIC.json" \
            "$GROUP8_ROOT/reports/33_BREAKOUT_TIMEFRAME_GAP_ANALYSIS.json"
          git diff --cached --check
          git commit -m "Fix Group 8 PA7 cross-timeframe boundary leakage [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
