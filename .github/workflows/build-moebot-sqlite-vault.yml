name: MoeBot SQLite Data Vault Closed - Mutation Guard

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed-vault-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse mutation of published Data Vault identities
        run: |
          echo "The published Data Vault lineage moebot-sqlite-rebuild-v1 is frozen."
          echo "Automatic rebuild and --clobber publication are disabled."
          echo "The historical build workflow remains available in Git history."
          echo "Use additive, SHA-pinned publication workflows for new dependency assets."
          exit 1
