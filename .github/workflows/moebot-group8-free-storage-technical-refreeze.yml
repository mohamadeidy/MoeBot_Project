name: MoeBot Group 8 Free Storage Technical Re-freeze

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_FREE_STORAGE_TECHNICAL_REFREEZE.txt"

permissions:
  contents: write

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  PYTHONUNBUFFERED: "1"

jobs:
  refreeze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preflight exact approved free-only storage state
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('MoeBot_Trading_System/Group_8');s=json.loads((r/'STATUS.json').read_text());f=json.loads((r/'DESIGN_FREEZE_MANIFEST.json').read_text());c=json.loads((r/'SHARDED_STORAGE_CONTRACT.json').read_text());a=json.loads((r/'reports/48_FULL_2023_STAGING_RELEASE.json').read_text())
          assert hashlib.sha256((r/'code/moebot_group8_engine_v0_8_0.py').read_bytes()).hexdigest()=='ab674be7601aed36d4d9e83eaedf7a1855f8e86297f7e9fc50ba01a9200dd4a0'
          assert f['design_freeze_hash']=='213a7f6384462bc00e44366062d56edf1f5ed9c2bcce6307e44aff3bf2f0ea7a'
          assert c['storage_contract_hash']=='d9d46f4f09c2558ef1373084be4aba8ec9c9744b8e0a6861c32b841f1f59e34a'
          assert c['free_only_policy']['paid_runner_allowed'] is False and c['free_only_policy']['paid_service_allowed'] is False
          assert s['blocking_gap']['gap_id']=='G8-FREE-STORAGE-CAPACITY-009' and s['blocking_gap']['decision_required'] is False
          assert s['annual_execution_2023_authorized'] is False and s['annual_execution_2024_authorized'] is False
          assert a['status']=='PASS' and a['free_only'] and not a['paid_runner_used'] and not a['paid_service_used'] and not a['oos_2024_accessed']
          print({'status':'PASS','free_only':True,'2024_oos':False})
          PY

      - name: Compile complete free execution layer
        run: |
          python -m py_compile \
            "$GROUP8_ROOT/code/group8_free_storage_technical_refreeze.py" \
            "$GROUP8_ROOT/code/group8_pa7_shard_executor.py" \
            "$GROUP8_ROOT/code/group8_pa7_scoped_shard_executor.py" \
            "$GROUP8_ROOT/code/group8_pa7_materialize_inputs.py" \
            "$GROUP8_ROOT/code/group8_shard_union_validator.py" \
            "$GROUP8_ROOT/code/group8_context_rejection_fastpath.py" \
            "$GROUP8_ROOT/code/group8_structural_narrative_fastpath.py"

      - name: Verify frozen semantic surfaces unchanged
        run: |
          git diff --exit-code origin/main -- \
            "$GROUP8_ROOT/FROZEN_CONFIG.json" \
            "$GROUP8_ROOT/01_DEFINITION_REGISTRY.json" \
            "$GROUP8_ROOT/02_SCHEMA.sql" \
            "$GROUP8_ROOT/DESIGN_FREEZE_MANIFEST.json" \
            "$GROUP8_ROOT/SHARDED_STORAGE_CONTRACT.json" \
            "$GROUP8_ROOT/UPSTREAM_ADAPTER_MAP.json" \
            "$GROUP8_ROOT/UPSTREAM_VALUE_BINDINGS.json" \
            "$GROUP8_ROOT/UPSTREAM_ANNUAL_DEPENDENCY_REGISTRY.json" \
            "$GROUP8_ROOT/contracts/UPSTREAM_INPUT_CONTRACT.json" \
            "$GROUP8_ROOT/code/moebot_group8_engine_v0_8_0.py" \
            "$GROUP8_ROOT/code/group8_postprocess_v0_8_0.py"

      - name: Run original frozen semantic regression matrices
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: |
          python -m unittest \
            "$GROUP8_ROOT/tests/test_group8_engine_v0_8_0.py" \
            "$GROUP8_ROOT/tests/test_group8_lifecycle_persistence_v0_8_0.py" \
            "$GROUP8_ROOT/tests/test_group8_breakout_timeframe_isolation_v0_8_0.py" \
            "$GROUP8_ROOT/tests/test_group8_pa7_transition_event_v0_8_0.py" \
            "$GROUP8_ROOT/tests/test_group8_pa7_lifecycle_retirement_v0_8_0.py"

      - name: Run free sharded parity and union matrices
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: |
          python -m unittest \
            "$GROUP8_ROOT/tests/test_group8_pa7_sharded_parity_v0_8_0.py" \
            "$GROUP8_ROOT/tests/test_group8_pa7_compact_staging.py" \
            "$GROUP8_ROOT/tests/test_group8_pa7_boundary_scope_split.py" \
            "$GROUP8_ROOT/tests/test_group8_shard_union_validator.py" \
            "$GROUP8_ROOT/tests/test_group8_context_rejection_fastpath.py" \
            "$GROUP8_ROOT/tests/test_group8_structural_narrative_fastpath.py"

      - name: Generate free-only technical refreeze artifacts
        run: |
          python "$GROUP8_ROOT/code/group8_free_storage_technical_refreeze.py"

      - name: Verify generated refreeze hashes and authorization boundaries
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=Path('MoeBot_Trading_System/Group_8');s=json.loads((r/'STATUS.json').read_text());m=json.loads((r/'ENGINE_BUILD_MANIFEST.json').read_text());a=json.loads((r/'reports/49_FREE_STORAGE_TECHNICAL_REFREEZE.json').read_text())
          stable=lambda v:hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          q=dict(a);rh=q.pop('report_hash');assert stable(q)==rh
          q=dict(m);mh=q.pop('manifest_hash');assert stable(q)==mh
          assert a['status']=='PASS' and a['free_only'] and not a['paid_runner_used'] and not a['paid_service_used'] and not a['oos_2024_accessed']
          assert m['status']=='TECHNICAL_CANDIDATE_PASS_FREE_SHARDED' and m['annual_execution_2023_authorized'] is True and m['annual_execution_2024_authorized'] is False
          assert s['blocking_gap'] is None and s['annual_execution_2023_authorized'] is True and s['annual_execution_2024_authorized'] is False and s['officially_closed'] is False
          assert s['free_only_policy']['paid_runner_allowed'] is False and s['free_only_policy']['paid_service_allowed'] is False
          print({'status':'PASS','technical_refreeze_report_hash':rh,'engine_build_manifest_hash':mh,'annual_2023_authorized':True,'annual_2024_authorized':False})
          PY

      - name: Commit verified technical refreeze
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "$GROUP8_ROOT/reports/49_FREE_STORAGE_TECHNICAL_REFREEZE.json" \
            "$GROUP8_ROOT/ENGINE_BUILD_MANIFEST.json" \
            "$GROUP8_ROOT/STATUS.json"
          git diff --cached --check
          git commit -m "Re-freeze Group 8 free sharded technical candidate [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
