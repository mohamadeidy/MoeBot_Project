name: MoeBot Group 7 Closed - Annual Rebuild Guard

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closed-group-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse mutation of the closed Group 7 data release
        run: |
          echo "Group 7 is officially closed. Automatic annual rebuild/upload has been disabled."
          echo "The historical workflow remains available in Git history."
          echo "Use the audited data-release recovery/amendment workflow for artifact-governance repair; never clobber a closed data tag."
          exit 1
