name: MoeBot Groups 9-15 Preparation Validation
on:
  push:
    branches: [ "groups9-15-preparation-v1" ]
    paths:
      - "MoeBot_Trading_System/GROUPS_9_15_*"
      - "MoeBot_Trading_System/groups9_15_shared/**"
      - "MoeBot_Trading_System/Group_9/**"
      - "MoeBot_Trading_System/Group_10/**"
      - "MoeBot_Trading_System/Group_11/**"
      - "MoeBot_Trading_System/Group_12/**"
      - "MoeBot_Trading_System/Group_13/**"
      - "MoeBot_Trading_System/Group_14/**"
      - "MoeBot_Trading_System/Group_15/**"
      - ".github/workflows/moebot-groups9-15-preparation.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile preparation tooling
        run: |
          python -m py_compile MoeBot_Trading_System/groups9_15_shared/dependency_gate.py
          python -m py_compile MoeBot_Trading_System/groups9_15_shared/resource_gate.py
      - name: Preparation contract tests
        run: python MoeBot_Trading_System/groups9_15_shared/tests/test_preparation_contract.py
