name: MoeBot Group 8 Fast Group7 DB Identity

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_DEPENDENCY_INTAKE.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  URL: https://github.com/mohamadeidy/MoeBot_Project/releases/download/moebot-group7-v0.7.5/MoeBot_Group7_XAUUSD_2023_v0.7.5_rebuilt_dukascopy_v1.sqlite.zst.part-000
  EXPECTED_DB_SHA: bcd550cca8a9131efa17d3cd4323aa47467172222756edc9c765bfacc5468af7
  EXPECTED_DB_SIZE: "8115417088"

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install zstd
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
      - name: Download and decompress current Group 7 transport
        run: |
          curl -L --fail --retry 5 --retry-all-errors -o "$RUNNER_TEMP/current.zst" "$URL"
          zstd -d --long=31 -f "$RUNNER_TEMP/current.zst" -o "$RUNNER_TEMP/current.sqlite"
      - name: Compute database identity only
        run: |
          python - <<'PY' | tee "$RUNNER_TEMP/db_identity.json"
          import hashlib, json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'current.sqlite'
          h=hashlib.sha256()
          with p.open('rb') as f:
              while b:=f.read(16*1024*1024): h.update(b)
          actual={'size_bytes':p.stat().st_size,'sha256':h.hexdigest()}
          expected={'size_bytes':int(os.environ['EXPECTED_DB_SIZE']),'sha256':os.environ['EXPECTED_DB_SHA']}
          print(json.dumps({'actual':actual,'expected':expected,'identity_pass':actual==expected},indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: group7-2023-current-db-identity-fast
          path: ${{ runner.temp }}/db_identity.json
          retention-days: 30
