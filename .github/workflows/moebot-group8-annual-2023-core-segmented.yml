name: MoeBot Group 8 Annual 2023 Core Segmented FREE Recovery

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_ANNUAL_2023_CORE_SEGMENTED.txt"

concurrency:
  group: moebot-group8-annual-core-2023-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  TAG: moebot-group8-annual-core-2023-v4-segmented
  PYTHONUNBUFFERED: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref || github.ref_name }}", fetch-depth: 0}
      - name: Preflight frozen FREE-only Annual 2023 authorization
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('MoeBot_Trading_System/Group_8');s=json.loads((r/'STATUS.json').read_text())
          assert s['annual_execution_2023_authorized'] is True
          assert s['annual_execution_2024_authorized'] is False
          assert s['blocking_gap'] is None and s['officially_closed'] is False
          assert not s['free_only_policy']['paid_runner_allowed'] and not s['free_only_policy']['paid_service_allowed']
          print({'status':'PASS','free_only':True,'year':2023,'oos_2024':False})
          PY
      - name: Verify immutable checkpoint 2 recovery anchor
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          mkdir -p "$RUNNER_TEMP/g8/cp"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'checkpoint2.*' --dir "$RUNNER_TEMP/g8/cp"
          cat "$RUNNER_TEMP/g8/cp/checkpoint2.sqlite.zst.part-"* > "$RUNNER_TEMP/g8/checkpoint2.sqlite.zst"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          b=Path(os.environ['RUNNER_TEMP'])/'g8';m=json.loads((b/'cp/checkpoint2.json').read_text());q=dict(m);saved=q.pop('report_hash')
          stable=lambda v:hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert stable(q)==saved and m['status']=='PASS' and m['year']==2023 and m['stage_end']==3
          assert m['segment_report']['status']=='PASS' and m['free_only'] and not m['paid_runner_used'] and not m['paid_service_used'] and not m['oos_2024_accessed']
          parts=sorted((b/'cp').glob('checkpoint2.sqlite.zst.part-*'));assert [p.name for p in parts]==[x['filename'] for x in m['parts']]
          for p,x in zip(parts,m['parts']):assert p.stat().st_size==x['size_bytes'] and hashlib.sha256(p.read_bytes()).hexdigest()==x['sha256']
          z=b/'checkpoint2.sqlite.zst';assert z.stat().st_size==m['compressed_size_bytes'] and hashlib.sha256(z.read_bytes()).hexdigest()==m['compressed_sha256']
          print({'status':'PASS','checkpoint':2,'stage_end':3,'report_hash':saved})
          PY

  stage-4:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref || github.ref_name }}", fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Restore verified staging and checkpoint 2
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          mkdir -p "$RUNNER_TEMP/g8/staging_parts" "$RUNNER_TEMP/g8/reports" "$RUNNER_TEMP/g8/cp"
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path('MoeBot_Trading_System/Group_8/reports/48_FULL_2023_STAGING_RELEASE.json').read_text());Path(os.environ['RUNNER_TEMP']+'/g8/staging_parts/urls.txt').write_text('\n'.join(x['url'] for x in m['parts'])+'\n')
          PY
          while read -r u; do curl -fL --retry 6 --retry-delay 2 "$u" -o "$RUNNER_TEMP/g8/staging_parts/$(basename "$u")"; done < "$RUNNER_TEMP/g8/staging_parts/urls.txt"
          cat "$RUNNER_TEMP/g8/staging_parts/MoeBot_Group8_FULL_2023_STAGING_v1.sqlite.zst.part-"* > "$RUNNER_TEMP/g8/staging.sqlite.zst"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'checkpoint2.*' --dir "$RUNNER_TEMP/g8/cp"
          cat "$RUNNER_TEMP/g8/cp/checkpoint2.sqlite.zst.part-"* > "$RUNNER_TEMP/g8/checkpoint2.sqlite.zst"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          b=Path(os.environ['RUNNER_TEMP'])/'g8';sm=json.loads(Path('MoeBot_Trading_System/Group_8/reports/48_FULL_2023_STAGING_RELEASE.json').read_text());sp=b/'staging.sqlite.zst';cm=json.loads((b/'cp/checkpoint2.json').read_text());cp=b/'checkpoint2.sqlite.zst'
          assert sp.stat().st_size==sm['compressed_size_bytes'] and hashlib.sha256(sp.read_bytes()).hexdigest()==sm['compressed_sha256']
          assert cm['stage_end']==3 and cp.stat().st_size==cm['compressed_size_bytes'] and hashlib.sha256(cp.read_bytes()).hexdigest()==cm['compressed_sha256']
          PY
          zstd -q -d -f "$RUNNER_TEMP/g8/staging.sqlite.zst" -o "$RUNNER_TEMP/g8/staging.sqlite"
          zstd -q -d -f "$RUNNER_TEMP/g8/checkpoint2.sqlite.zst" -o "$RUNNER_TEMP/g8/core.sqlite"
      - name: Execute exact stage 4
        env: {PYTHONPATH: "${{ env.GROUP8_ROOT }}/code"}
        run: python "$GROUP8_ROOT/code/group8_segmented_annual_core.py" --staging-db "$RUNNER_TEMP/g8/staging.sqlite" --output-db "$RUNNER_TEMP/g8/core.sqlite" --artifacts-root "$GROUP8_ROOT" --year 2023 --symbol XAUUSD_ --start 4 --end 4 --report "$RUNNER_TEMP/g8/reports/stage4.json"
      - name: Publish SHA-bound checkpoint 3
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          zstd -q -3 -T0 -f "$RUNNER_TEMP/g8/core.sqlite" -o "$RUNNER_TEMP/g8/checkpoint3.sqlite.zst"
          split -b 1750000000 -d -a 3 "$RUNNER_TEMP/g8/checkpoint3.sqlite.zst" "$RUNNER_TEMP/g8/checkpoint3.sqlite.zst.part-"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          b=Path(os.environ['RUNNER_TEMP'])/'g8';sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest();parts=[{'filename':p.name,'size_bytes':p.stat().st_size,'sha256':sha(p)} for p in sorted(b.glob('checkpoint3.sqlite.zst.part-*'))];r=json.loads((b/'reports/stage4.json').read_text());parent=json.loads((b/'cp/checkpoint2.json').read_text())
          m={'status':'PASS','year':2023,'stage_end':4,'source_checkpoint_report_hash':parent['report_hash'],'raw_size_bytes':(b/'core.sqlite').stat().st_size,'raw_sha256':sha(b/'core.sqlite'),'compressed_size_bytes':(b/'checkpoint3.sqlite.zst').stat().st_size,'compressed_sha256':sha(b/'checkpoint3.sqlite.zst'),'parts':parts,'segment_report':r,'free_only':True,'paid_runner_used':False,'paid_service_used':False,'oos_2024_accessed':False};m['report_hash']=hashlib.sha256(json.dumps(m,sort_keys=True,separators=(',',':')).encode()).hexdigest();(b/'checkpoint3.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
          gh release upload "$TAG" "$RUNNER_TEMP/g8/checkpoint3.sqlite.zst.part-"* "$RUNNER_TEMP/g8/checkpoint3.json" --repo "$GITHUB_REPOSITORY" --clobber

