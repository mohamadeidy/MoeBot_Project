            --stage 7 --work-dir "$RUNNER_TEMP/g8" --report "$RUNNER_TEMP/g8/stage7.json"
      - name: Record official release report on exact PR head
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GROUP8_ROOT/reports/50_ANNUAL_2023_CORE_RELEASE.json"
