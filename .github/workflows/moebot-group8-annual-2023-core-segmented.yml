  stage4-p23:
    needs: stage4-p22
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Record full-job start
        run: date +%s > "$RUNNER_TEMP/job_start_epoch"
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install FREE runner dependency
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd
      - uses: actions/download-artifact@v4
        with:
          name: stage4-preofficial-gates
          path: "${{ runner.temp }}/gates"
      - name: Verify official authorization gate
        run: python -c "import json;d=json.load(open('$RUNNER_TEMP/gates/STAGE4_PREOFFICIAL_GATES.json'));assert d['official_execution_authorized'] is True"
      - name: Execute and publish frozen range 23-23
        env:
          GH_TOKEN: "${{ github.token }}"
          PYTHONPATH: "${{ env.GROUP8_ROOT }}/code"
        run: |
          python "$GROUP8_ROOT/code/group8_stage4_full_job.py" \
            --mode official \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --artifacts-root "$GROUP8_ROOT" \
            --partition 23 \
            --work-dir "$RUNNER_TEMP/g8" \
            --job-start-epoch "$(cat "$RUNNER_TEMP/job_start_epoch")" \
            --report "$RUNNER_TEMP/g8/stage4-official-23.json"
      - uses: actions/upload-artifact@v4
        with:
          name: stage4-official-23
          path: "${{ runner.temp }}/g8/stage4-official-23.json"
          if-no-files-found: error

  stage4-finalize:
