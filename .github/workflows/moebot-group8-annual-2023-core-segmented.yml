            --stage 5 --work-dir "$RUNNER_TEMP/g8" --report "$RUNNER_TEMP/g8/stage5.json"

  stage-6:
    needs: stage-5
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
