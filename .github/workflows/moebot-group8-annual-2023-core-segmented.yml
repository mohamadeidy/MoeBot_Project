          assert hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest()==saved and cm['stage_end']==4
          assert sp.stat().st_size==sm['compressed_size_bytes'] and hashlib.sha256(sp.read_bytes()).hexdigest()==sm['compressed_sha256']
          assert cp.stat().st_size==cm['compressed_size_bytes'] and hashlib.sha256(cp.read_bytes()).hexdigest()==cm['compressed_sha256']
          PY
          zstd -q -d -f "$RUNNER_TEMP/g8/staging.sqlite.zst" -o "$RUNNER_TEMP/g8/staging.sqlite"
          zstd -q -d -f "$RUNNER_TEMP/g8/checkpoint3.sqlite.zst" -o "$RUNNER_TEMP/g8/core.sqlite"
      - name: Execute exact stage 5
