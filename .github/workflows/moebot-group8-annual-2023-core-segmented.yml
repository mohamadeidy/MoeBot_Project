          split -b 1750000000 -d -a 3 "$RUNNER_TEMP/g8/checkpoint4.sqlite.zst" "$RUNNER_TEMP/g8/checkpoint4.sqlite.zst.part-"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          b=Path(os.environ['RUNNER_TEMP'])/'g8';sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest();parts=[{'filename':p.name,'size_bytes':p.stat().st_size,'sha256':sha(p)} for p in sorted(b.glob('checkpoint4.sqlite.zst.part-*'))];r=json.loads((b/'reports/stage5.json').read_text());parent=json.loads((b/'cp/checkpoint3.json').read_text())
          m={'status':'PASS','year':2023,'stage_end':5,'source_checkpoint_report_hash':parent['report_hash'],'raw_size_bytes':(b/'core.sqlite').stat().st_size,'raw_sha256':sha(b/'core.sqlite'),'compressed_size_bytes':(b/'checkpoint4.sqlite.zst').stat().st_size,'compressed_sha256':sha(b/'checkpoint4.sqlite.zst'),'parts':parts,'segment_report':r,'free_only':True,'paid_runner_used':False,'paid_service_used':False,'oos_2024_accessed':False};m['report_hash']=hashlib.sha256(json.dumps(m,sort_keys=True,separators=(',',':')).encode()).hexdigest();(b/'checkpoint4.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
          gh release upload "$TAG" "$RUNNER_TEMP/g8/checkpoint4.sqlite.zst.part-"* "$RUNNER_TEMP/g8/checkpoint4.json" --repo "$GITHUB_REPOSITORY" --clobber

