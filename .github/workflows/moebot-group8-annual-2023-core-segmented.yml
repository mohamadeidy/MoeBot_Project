          PYTHONPATH: "${{ env.GROUP8_ROOT }}/code"
        run: |
          python "$GROUP8_ROOT/code/group8_annual_stage_release.py" \
            --repo "$GITHUB_REPOSITORY" --tag "$TAG" --artifacts-root "$GROUP8_ROOT" \
            --stage 6 --work-dir "$RUNNER_TEMP/g8" --report "$RUNNER_TEMP/g8/stage6.json"

  stage-7-final:
    needs: stage-6
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
