      - name: Complete 24-partition coverage and publish checkpoint 3
        env:
          GH_TOKEN: "${{ github.token }}"
          PYTHONPATH: "${{ env.GROUP8_ROOT }}/code"
        run: |
          python "$GROUP8_ROOT/code/group8_stage4_finalize_release.py" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --artifacts-root "$GROUP8_ROOT" \
            --work-dir "$RUNNER_TEMP/g8" \
            --report "$RUNNER_TEMP/g8/checkpoint3-finalization.json"

  stage-5:
