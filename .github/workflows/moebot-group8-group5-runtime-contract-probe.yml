name: MoeBot Group 8 Group5 Runtime Contract Probe

"on":
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/group8_group5_runtime_contract_probe.py"

permissions:
  contents: write

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preflight
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('MoeBot_Trading_System/Group_8/STATUS.json').read_text())
          assert s['annual_execution_2023_authorized'] is True
          assert s['annual_execution_2024_authorized'] is False
          assert s['officially_closed'] is False
          PY
          python -m py_compile .github/scripts/group8_group5_runtime_contract_probe.py
      - name: Recover and inspect exact frozen Group5 runtime
        run: |
          python .github/scripts/group8_group5_runtime_contract_probe.py \
            --group8-root "$GROUP8_ROOT" \
            --report "$GROUP8_ROOT/reports/39E_GROUP5_RUNTIME_LIFECYCLE_CONTRACT_PROBE.json"
      - name: Verify no frozen mutation or OOS
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('MoeBot_Trading_System/Group_8/reports/39E_GROUP5_RUNTIME_LIFECYCLE_CONTRACT_PROBE.json');r=json.loads(p.read_text());q=dict(r);h=q.pop('report_hash')
          assert hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()==h
          assert r['status']=='PASS' and r['observations']['runtime_bytes_verified'] is True and r['observations']['oos_2024_accessed'] is False
          print({'status':'PASS','asset':r['runtime_bundle']['name'],'release':r['runtime_bundle']['release'],'group5_sha':r['group5_runtime_sha256']})
          PY
          git diff --exit-code origin/main -- "$GROUP8_ROOT/STATUS.json" "$GROUP8_ROOT/ENGINE_BUILD_MANIFEST.json" "$GROUP8_ROOT/FROZEN_CONFIG.json" "$GROUP8_ROOT/01_DEFINITION_REGISTRY.json" "$GROUP8_ROOT/DESIGN_FREEZE_MANIFEST.json" "$GROUP8_ROOT/02_SCHEMA.sql"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: group8-group5-runtime-contract-probe
          path: ${{ env.GROUP8_ROOT }}/reports/39E_GROUP5_RUNTIME_LIFECYCLE_CONTRACT_PROBE.json
      - name: Commit evidence
        if: github.event_name == 'pull_request' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GROUP8_ROOT/reports/39E_GROUP5_RUNTIME_LIFECYCLE_CONTRACT_PROBE.json"
          git commit -m "Record Group 5 runtime lifecycle contract probe [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
