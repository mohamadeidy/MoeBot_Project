name: MoeBot Group 8 Annual 2023 Core Free ARM64

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_ANNUAL_2023_CORE_ARM.txt"

permissions:
  contents: write

env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  TAG: moebot-group8-annual-core-2023-v3-arm
  ARCHIVE: MoeBot_Group8_ANNUAL_CORE_2023_v3_arm.sqlite.zst
  MANIFEST: MoeBot_Group8_ANNUAL_CORE_2023_v3_arm.json
  PYTHONUNBUFFERED: "1"

jobs:
  build-core:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove ARM64 exact optimized-core parity
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: |
          set -euo pipefail
          uname -m
          python "$GROUP8_ROOT/tests/test_group8_bounded_range_fastpath.py"
          python "$GROUP8_ROOT/tests/test_group8_annual_core_driver.py"
      - name: Preflight FREE-only Annual 2023 authorization
        run: |
          python - <<'PY'
          import json,platform
          from pathlib import Path
          r=Path('MoeBot_Trading_System/Group_8');s=json.loads((r/'STATUS.json').read_text());a=json.loads((r/'reports/48_FULL_2023_STAGING_RELEASE.json').read_text())
          assert s['annual_execution_2023_authorized'] is True and s['annual_execution_2024_authorized'] is False and s['blocking_gap'] is None and s['officially_closed'] is False
          assert s['free_only_policy']['paid_runner_allowed'] is False and s['free_only_policy']['paid_service_allowed'] is False
          assert a['status']=='PASS' and a['year']==2023 and a['free_only'] and not a['oos_2024_accessed']
          print({'status':'PASS','machine':platform.machine(),'free_only':True,'annual_2023':True,'2024_oos':False,'staging_report_hash':a['report_hash']})
          PY
      - name: Reclaim unused preinstalled ARM runner storage
        run: |
          docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          df -h /
      - name: Restore verified reusable full 2023 staging
        run: |
          mkdir -p "$RUNNER_TEMP/g8-core/staging_parts" "$RUNNER_TEMP/g8-core/reports"
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path('MoeBot_Trading_System/Group_8/reports/48_FULL_2023_STAGING_RELEASE.json').read_text());p=Path(os.environ['RUNNER_TEMP'])/'g8-core/staging_parts/urls.txt';p.write_text('\n'.join(x['url'] for x in m['parts'])+'\n')
          PY
          while read -r url; do curl -fL --retry 6 --retry-delay 2 "$url" -o "$RUNNER_TEMP/g8-core/staging_parts/$(basename "$url")"; done < "$RUNNER_TEMP/g8-core/staging_parts/urls.txt"
          cat "$RUNNER_TEMP/g8-core/staging_parts/MoeBot_Group8_FULL_2023_STAGING_v1.sqlite.zst.part-"* > "$RUNNER_TEMP/g8-core/staging.sqlite.zst"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          m=json.loads(Path('MoeBot_Trading_System/Group_8/reports/48_FULL_2023_STAGING_RELEASE.json').read_text());p=Path(os.environ['RUNNER_TEMP'])/'g8-core/staging.sqlite.zst';h=hashlib.sha256(p.read_bytes()).hexdigest();assert h==m['compressed_sha256'] and p.stat().st_size==m['compressed_size_bytes'];print({'status':'PASS','compressed_sha256':h})
          PY
          zstd -q -d -f "$RUNNER_TEMP/g8-core/staging.sqlite.zst" -o "$RUNNER_TEMP/g8-core/staging.sqlite"
          rm -f "$RUNNER_TEMP/g8-core/staging.sqlite.zst"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          m=json.loads(Path('MoeBot_Trading_System/Group_8/reports/48_FULL_2023_STAGING_RELEASE.json').read_text());p=Path(os.environ['RUNNER_TEMP'])/'g8-core/staging.sqlite';h=hashlib.sha256(p.read_bytes()).hexdigest();assert h==m['raw_sha256'] and p.stat().st_size==m['raw_size_bytes'];print({'status':'PASS','raw_sha256':h,'bytes':p.stat().st_size})
          PY
      - name: Execute optimized exact Annual 2023 core on ARM64
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code
        run: |
          set -euo pipefail
          START=$(date +%s)
          /usr/bin/time -v python "$GROUP8_ROOT/code/group8_annual_core_driver.py" --staging-db "$RUNNER_TEMP/g8-core/staging.sqlite" --output-db "$RUNNER_TEMP/g8-core/core.sqlite" --artifacts-root "$GROUP8_ROOT" --year 2023 --symbol XAUUSD_ --report "$RUNNER_TEMP/g8-core/reports/CORE_EXECUTION.json" 2> "$RUNNER_TEMP/g8-core/reports/CORE_TIME.txt"
          END=$(date +%s); echo $((END-START)) > "$RUNNER_TEMP/g8-core/reports/CORE_SECONDS.txt"
      - name: Fingerprint and validate Annual 2023 core
        run: |
          python "$GROUP8_ROOT/code/group8_sqlite_fingerprint.py" --database "$RUNNER_TEMP/g8-core/core.sqlite" --output "$RUNNER_TEMP/g8-core/reports/CORE_FINGERPRINT.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'g8-core';r=json.loads((base/'reports/CORE_EXECUTION.json').read_text());f=json.loads((base/'reports/CORE_FINGERPRINT.json').read_text())
          assert r['status']=='PASS' and r['free_only'] and not r['oos_2024_accessed'];assert f['status']=='PASS' and f['quick_check']=='ok' and f['integrity_check']=='ok' and f['foreign_key_errors']==0
          print({'status':'PASS','logical_sha256':f['logical_sha256'],'db_bytes':f['database_size_bytes']})
          PY
      - name: Compress and split core release
        run: |
          zstd -q -6 -T0 -f "$RUNNER_TEMP/g8-core/core.sqlite" -o "$RUNNER_TEMP/g8-core/$ARCHIVE"
          split -b 1800000000 -d -a 3 "$RUNNER_TEMP/g8-core/$ARCHIVE" "$RUNNER_TEMP/g8-core/$ARCHIVE.part-"
      - name: Build immutable ARM core release manifest
        run: |
          python - <<'PY'
          import hashlib,json,os,platform
          from pathlib import Path
          root=Path('MoeBot_Trading_System/Group_8');base=Path(os.environ['RUNNER_TEMP'])/'g8-core';fp=json.loads((base/'reports/CORE_FINGERPRINT.json').read_text());ex=json.loads((base/'reports/CORE_EXECUTION.json').read_text());stage=json.loads((root/'reports/48_FULL_2023_STAGING_RELEASE.json').read_text())
          def sha(p):
            h=hashlib.sha256()
            with p.open('rb') as f:
              for c in iter(lambda:f.read(16*1024*1024),b''):h.update(c)
            return h.hexdigest()
          stable=lambda v:hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest();parts=[]
          for p in sorted(base.glob(os.environ['ARCHIVE']+'.part-*')):
            assert p.stat().st_size<2_000_000_000;parts.append({'filename':p.name,'size_bytes':p.stat().st_size,'sha256':sha(p),'url':f"https://github.com/mohamadeidy/MoeBot_Project/releases/download/{os.environ['TAG']}/{p.name}"})
          rec={'format_version':3,'status':'PASS','artifact_kind':'GROUP8_ANNUAL_CORE','year':2023,'physical_role':'ANNUAL_CORE_NON_PA7','runner_class':'STANDARD_GITHUB_HOSTED_ARM64','release_tag':os.environ['TAG'],'archive_filename':os.environ['ARCHIVE'],'parts':parts,'part_count':len(parts),'raw_size_bytes':fp['database_size_bytes'],'raw_sha256':fp['database_sha256'],'logical_sha256':fp['logical_sha256'],'table_fingerprints':{k:v['logical_sha256'] for k,v in fp['tables'].items()},'table_row_counts':{k:v['row_count'] for k,v in fp['tables'].items()},'staging_release_report_hash':stage['report_hash'],'engine_sha256':'ab674be7601aed36d4d9e83eaedf7a1855f8e86297f7e9fc50ba01a9200dd4a0','design_freeze_hash':'213a7f6384462bc00e44366062d56edf1f5ed9c2bcce6307e44aff3bf2f0ea7a','storage_contract_hash':'d9d46f4f09c2558ef1373084be4aba8ec9c9744b8e0a6861c32b841f1f59e34a','execution_seconds':int((base/'reports/CORE_SECONDS.txt').read_text()),'free_only':True,'paid_runner_used':False,'paid_service_used':False,'oos_2024_accessed':False,'deferred':ex['deferred']};rec['report_hash']=stable(rec)
          (base/os.environ['MANIFEST']).write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n');(root/'reports/50_ANNUAL_2023_CORE_RELEASE.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n');print({'status':'PASS','runner':rec['runner_class'],'parts':len(parts),'raw_size_bytes':rec['raw_size_bytes'],'logical_sha256':rec['logical_sha256'],'report_hash':rec['report_hash']})
          PY
      - name: Publish free ARM core release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --title "MoeBot Group 8 Annual Core 2023 v3 ARM" --notes "FREE-ONLY optimized exact Annual 2023 core on standard ARM64 runner. 2024 OOS untouched."; fi
          gh release upload "$TAG" "$RUNNER_TEMP/g8-core/$ARCHIVE.part-"* "$RUNNER_TEMP/g8-core/$MANIFEST" "$RUNNER_TEMP/g8-core/reports/CORE_EXECUTION.json" "$RUNNER_TEMP/g8-core/reports/CORE_FINGERPRINT.json" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Public redownload and verify all core parts
        run: |
          mkdir -p "$RUNNER_TEMP/g8-core/redownload"
          python - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads((Path(os.environ['RUNNER_TEMP'])/'g8-core'/os.environ['MANIFEST']).read_text());(Path(os.environ['RUNNER_TEMP'])/'g8-core/redownload/urls.txt').write_text('\n'.join(x['url'] for x in m['parts'])+'\n')
          PY
          while read -r url; do curl -fL --retry 5 --retry-delay 2 "$url" -o "$RUNNER_TEMP/g8-core/redownload/$(basename "$url")"; done < "$RUNNER_TEMP/g8-core/redownload/urls.txt"
          cat "$RUNNER_TEMP/g8-core/redownload/$ARCHIVE.part-"* > "$RUNNER_TEMP/g8-core/redownload/$ARCHIVE"
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])/'g8-core';p=base/'redownload'/os.environ['ARCHIVE'];h=hashlib.sha256(p.read_bytes()).hexdigest();orig=hashlib.sha256((base/os.environ['ARCHIVE']).read_bytes()).hexdigest();assert h==orig;print({'status':'PASS','archive_sha256':h})
          PY
      - name: Commit permanent Annual 2023 ARM core identity
        run: |
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GROUP8_ROOT/reports/50_ANNUAL_2023_CORE_RELEASE.json";git diff --cached --check
          git commit -m "Record Group 8 Annual 2023 free ARM core release [skip ci]";git push origin "HEAD:${{ github.head_ref }}"
