name: MoeBot Group 8 PA7 2023 Root Window Inventory

"on":
  pull_request:
    branches: [main]
    paths:
      - "MoeBot_Trading_System/Group_8/TRIGGER_PA7_ROOT_WINDOW_INVENTORY.txt"
permissions:
  contents: write
env:
  GROUP8_ROOT: MoeBot_Trading_System/Group_8
  PYTHONUNBUFFERED: "1"
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.head_ref || github.ref_name }}", fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Preflight free-only 2023
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('MoeBot_Trading_System/Group_8');s=json.loads((r/'STATUS.json').read_text());m=json.loads((r/'reports/47_PA7_2023_COMPACT_STAGING_RELEASE.json').read_text())
          assert s['annual_execution_2023_authorized'] is True and s['annual_execution_2024_authorized'] is False and s['blocking_gap'] is None
          assert not s['free_only_policy']['paid_runner_allowed'] and not s['free_only_policy']['paid_service_allowed']
          assert m['status']=='PASS' and m['free_only'] and not m['oos_2024_accessed']
          print({'status':'PASS','free_only':True,'2024_oos':False})
          PY
      - name: Prove root-window partition completeness on frozen fixture
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code:${{ env.GROUP8_ROOT }}/tests
        run: python -m unittest "$GROUP8_ROOT/tests/test_group8_pa7_root_window_inventory.py"
      - name: Restore reusable compact 2023 staging
        run: |
          docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          mkdir -p "$RUNNER_TEMP/g8-root"
          curl -fL --retry 6 --retry-delay 2 "https://github.com/mohamadeidy/MoeBot_Project/releases/download/moebot-group8-pa7-staging-2023-v1/MoeBot_Group8_PA7_2023_COMPACT_STAGING_v1.sqlite.zst" -o "$RUNNER_TEMP/g8-root/staging.sqlite.zst"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          m=json.loads(Path('MoeBot_Trading_System/Group_8/reports/47_PA7_2023_COMPACT_STAGING_RELEASE.json').read_text());p=Path(os.environ['RUNNER_TEMP'])/'g8-root/staging.sqlite.zst';assert hashlib.sha256(p.read_bytes()).hexdigest()==m['compressed_sha256'] and p.stat().st_size==m['compressed_size_bytes'];print({'status':'PASS'})
          PY
          zstd -q -d -f "$RUNNER_TEMP/g8-root/staging.sqlite.zst" -o "$RUNNER_TEMP/g8-root/staging.sqlite"
      - name: Inventory every real 2023 causal root window
        env:
          PYTHONPATH: ${{ env.GROUP8_ROOT }}/code
        run: |
          python "$GROUP8_ROOT/code/group8_pa7_root_window_inventory.py" \
            --staging-db "$RUNNER_TEMP/g8-root/staging.sqlite" --artifacts-root "$GROUP8_ROOT" \
            --year 2023 --symbol XAUUSD_ --timeframes M1 M5 M15 M30 H1 H4 D1 \
            --report "$GROUP8_ROOT/reports/52_PA7_2023_ROOT_WINDOW_INVENTORY.json"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('MoeBot_Trading_System/Group_8/reports/52_PA7_2023_ROOT_WINDOW_INVENTORY.json');r=json.loads(p.read_text());q=dict(r);h=q.pop('report_hash');stable=lambda v:hashlib.sha256(json.dumps(v,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest();assert stable(q)==h;assert r['status']=='PASS' and r['free_only'] and not r['oos_2024_accessed'];print({'status':'PASS','windows':r['all_observed_root_windows'],'report_hash':h})
          PY
      - name: Audit frozen surfaces unchanged
        run: git diff --exit-code origin/main -- "$GROUP8_ROOT/FROZEN_CONFIG.json" "$GROUP8_ROOT/01_DEFINITION_REGISTRY.json" "$GROUP8_ROOT/02_SCHEMA.sql" "$GROUP8_ROOT/DESIGN_FREEZE_MANIFEST.json" "$GROUP8_ROOT/SHARDED_STORAGE_CONTRACT.json" "$GROUP8_ROOT/code/moebot_group8_engine_v0_8_0.py" "$GROUP8_ROOT/STATUS.json"
      - name: Commit root-window inventory
        run: |
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GROUP8_ROOT/reports/52_PA7_2023_ROOT_WINDOW_INVENTORY.json";git diff --cached --check
          git commit -m "Record Group 8 PA7 2023 root-window inventory [skip ci]";git push origin "HEAD:${{ github.head_ref }}"
